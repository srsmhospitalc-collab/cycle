<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gummy Galaxy - Candy Crush</title>
<link rel="stylesheet" href="candy.css">
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  window.TelegramAdsController = new TelegramAdsController();
  window.TelegramAdsController.initialize({
    pubId: "1013423",
    appId: "7744",
    debug: false
  });
</script>
<!-- Monetag LIVE - Added -->
<script src='//libtl.com/sdk.js' data-zone='11215599' data-sdk='show_11215599'></script>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo"><span class="logo-icon">🍬</span> GUMMY GALAXY</div>
    <div class="stats">
      <div class="stat"><span>LEVEL</span><b id="levelTxt">1</b></div>
      <div class="stat"><span>SCORE</span><b id="scoreTxt">0</b></div>
      <div class="stat"><span>MOVES</span><b id="movesTxt">25</b></div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div id="progressFill"></div></div>
    <div class="target">Target: <b id="targetTxt">800</b></div>
  </div>
  <div class="board-container">
    <div id="board" class="board"></div>
    <div id="combo" class="combo">COMBO x2!</div>
  </div>
  <div class="bottom-panel">
    <div class="embed-ad" id="embedAd">
      <span class="ad-label">AD</span>
      <div class="ad-content">🎁 Play & Earn - RichAds</div>
    </div>
    <div class="controls">
      <button id="hintBtn">💡 Hint</button>
      <button id="shuffleBtn">🔀 Shuffle</button>
    </div>
  </div>
  <div id="levelModal" class="modal hidden">
    <div class="modal-card">
      <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
      <h2 id="modalTitle">Level Complete!</h2>
      <p id="modalScore">Score: 1200</p>
      <div id="adInfo" class="ad-info">Loading bonus...</div>
      <button id="nextBtn" class="primary-btn">Next Level 🚀</button>
    </div>
  </div>
  <div id="lockedModal" class="modal hidden">
    <div class="modal-card locked-card">
      <div class="lock-icon">🔒</div>
      <h2>Level <span id="lockedLevel">5</span> Locked!</h2>
      <p>Watch a short video to unlock this Galaxy!</p>
      <div class="reward-preview">🎁 +50 Moves + Bomb Booster</div>
      <button id="unlockBtn" class="primary-btn reward-btn">🎥 Watch & Unlock</button>
      <p class="small">Powered by Rewarded Ads</p>
    </div>
  </div>
  <div id="toast" class="toast"></div>
</div>
<script src="candy.js"></script>
</body>
</html>
