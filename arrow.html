<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arrow Escape - Neon Puzzle</title>
<link rel="stylesheet" href="arrow.css">

<!-- Telegram SDK -->
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>

<!-- Monetag Tags -->
<script>(function(s){s.dataset.zone='12050551',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script src="https://5gvci.com/act/files/tag.min.js?z=12050601" data-cfasync="false" async></script>

<!-- Adexium Ads - Tera WID -->
<script src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
<script>
  let adexiumWidget;
  document.addEventListener('DOMContentLoaded', () => {
    adexiumWidget = new AdexiumWidget({
      wid: 'eb8fe161-d2d4-4452-865e-f7565c5f0e43',
      adFormat: 'interstitial',
      debug: false
    });
  });
  function showAdexiumAd(){
    try{ if(adexiumWidget) adexiumWidget.showAd(); }catch(e){console.log("Ad fail",e)}
  }
</script>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<header>
  <div class="logo">ARROW<span>ESCAPE</span></div>
  <div class="stats">
    <div class="stat-box">LEVEL <b id="level">1</b></div>
    <div class="stat-box">MOVES <b id="moves">0</b></div>
  </div>
</header>

<div class="game-container">
  <div id="board"></div>
  <div class="controls">
    <button id="hintBtn" class="btn-glass">💡 HINT (AD)</button>
    <button id="resetBtn" class="btn-glass">↺ RESET</button>
  </div>
</div>

<div id="winModal" class="modal">
  <div class="modal-card">
    <h2>ESCAPED!</h2>
    <p>Perfect Path Found</p>
    <div class="stars">⭐⭐⭐</div>
    <button id="nextBtn" class="btn-neon">NEXT LEVEL</button>
  </div>
</div>

<script src="arrow.js"></script>
</body>
</html>
