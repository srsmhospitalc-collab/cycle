<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arrow Escape</title>
<link rel="stylesheet" href="arrow.css">

<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<script src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
<script>
  let adexiumWidget;
  document.addEventListener('DOMContentLoaded', () => {
    // Telegram ready karna zaroori hai
    if(window.Telegram && Telegram.WebApp) Telegram.WebApp.ready();
    
    adexiumWidget = new AdexiumWidget({
      wid: 'eb8fe161-d2d4-4452-865e-f7565c5f0e43',
      adFormat: 'interstitial',
      debug: true // Test ad lane ke liye
    });
    console.log("Adexium Initialized");
  });

  function showAd(){
    console.log("Trying to show ad...");
    if(adexiumWidget){
      adexiumWidget.showAd().then(()=>console.log("Ad shown")).catch(e=>console.log("Ad error",e));
    } else {
      console.log("Widget not ready");
    }
  }
</script>
</head>
<body>
<div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
<header>
  <div class="logo">ARROW<span>ESCAPE</span></div>
  <div class="stats">
    <div class="stat-box">LEVEL <b id="level">1</b></div>
    <div class="stat-box">MOVES <b id="moves">0</b></div>
  </div>
</header>
<div class="game-container">
  <div id="board"></div>
  <div class="controls">
    <button id="hintBtn" class="btn-glass">💡 HINT</button>
    <button id="resetBtn" class="btn-glass">↺ RESET</button>
  </div>
</div>
<div id="winModal" class="modal">
  <div class="modal-card">
    <h2>ESCAPED!</h2>
    <p>Perfect Path Found</p>
    <button id="nextBtn" class="btn-neon">NEXT LEVEL</button>
  </div>
</div>
<script src="arrow.js"></script>
</body>
</html>
