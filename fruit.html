<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FRUIT CUT SORT BLAST</title>
<link rel="stylesheet" href="fruit.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- RichAds -->
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  try {
    if(window.parent && window.parent.TelegramAdsController){
      window.TelegramAdsController = window.parent.TelegramAdsController;
    } else {
      window.TelegramAdsController = new TelegramAdsController();
      window.TelegramAdsController.initialize({ pubId: "1013423", appId: "7744" });
    }
  } catch(e){}
</script>

<!-- Monetag -->
<script>
  if(window.parent && window.parent.show_11215599){
    window.show_11215599 = window.parent.show_11215599;
  }
</script>
<script src="https://libtl.com/sdk.js" data-zone="11215599" data-sdk="show_11215599"></script>
</head>
<body>
<div class="bg"></div>
<header class="top">
  <a href="index.html" class="back">←</a>
  <div class="title">🍉 FRUIT CUT</div>
  <div class="stats"><span id="lvl">LVL 1</span> <span id="score">0/20</span></div>
  <button id="gridBtn" class="grid">☰</button>
</header>
<div class="game-wrap">
  <div id="fallArea" class="fall-area"></div>
  <div id="congrats" class="congrats">
    <div class="confetti">🎉</div>
    <h2>JUICY WIN!</h2>
    <p id="congratsText"></p>
    <div class="loader"><div></div></div>
    <small>Loading next levels...</small>
  </div>
  <div class="baskets">
    <div class="basket b-red" data-color="red"><div class="b-icon">🧺</div><div class="b-label">RED</div><div id="c-red" class="b-count">0</div></div>
    <div class="basket b-yellow" data-color="yellow"><div class="b-icon">🧺</div><div class="b-label">YELLOW</div><div id="c-yellow" class="b-count">0</div></div>
    <div class="basket b-purple" data-color="purple"><div class="b-icon">🧺</div><div class="b-label">PURPLE</div><div id="c-purple" class="b-count">0</div></div>
  </div>
  <div class="progress"><div id="prog"></div></div>
</div>
<div class="controls">
  <button id="slowBtn">⏱ Slow-Mo 📺</button>
  <button id="bombBtn">💣 Blast All 📺</button>
</div>
<div id="levelScreen" class="modal show">
  <div class="box">
    <h1>🍉 FRUIT CUT SORT</h1>
    <p>Tap to cut & auto sort to basket!</p>
    <div id="levelGrid" class="level-grid"></div>
    <button id="playBtn" class="main">PLAY</button>
  </div>
</div>
<div id="adModal" class="modal">
  <div class="box small">
    <div class="lock">🔒</div>
    <h3 id="adTitle">Locked</h3>
    <button id="watchBtn" class="main">📺 WATCH AD & UNLOCK</button>
    <button id="cancelBtn" class="ghost">Cancel</button>
    <div id="adStatus"></div>
  </div>
</div>
<div id="winModal" class="modal">
  <div class="box small win">
    <h2>🎉 Juicy Win!</h2>
    <p id="winText"></p>
    <button id="nextBtn" class="main">NEXT →</button>
  </div>
</div>
<div id="loseModal" class="modal">
  <div class="box small lose">
    <h2>😢 Too Many Missed</h2>
    <p>3 fruits miss ho gaye</p>
    <button id="contBtn" class="main">CONTINUE 📺</button>
    <button id="restartBtn" class="ghost">Restart</button>
  </div>
</div>
<script src="fruit.js"></script>
</body>
</html>
