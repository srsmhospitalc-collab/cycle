<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

  apiKey: "AIzaSyBBaxVAyNYG6v2Xs6_yF-Z_f1Tm3oftpQk",
  authDomain: "sfaearn.firebaseapp.com",
  databaseURL: "https://sfaearn-default-rtdb.asia-southeast1.firebasedatabase.app",

};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const uid = tg.initDataUnsafe?.user?.id?.toString();
let bal=0;
async function initBalance(){
  if(!uid) return;
  try{
    const snap = await get(ref(db,'users/'+uid));
    if(snap.exists()) bal = snap.val().balance || 0;
    document.getElementById('coinBal').innerText = bal;
    bState();
  }catch(e){ bState(); }
}
initBalance();
function bState(){
  const lock=parseInt(localStorage.getItem('claim8500_lock_'+uid)||'0');
  const btn=document.getElementById('claimBtn');
  const timer=document.getElementById('timerBox');
  if(lock>Date.now()){
    btn.disabled=true;
    const h=Math.ceil((lock-Date.now())/3600000);
    btn.innerHTML=`<i class="fa-solid fa-lock"></i> LOCKED ${h}h LEFT`;
    timer.style.display='block';
    let rem=lock-Date.now();
    let iv=setInterval(()=>{
      rem-=1000;
      if(rem<=0){clearInterval(iv);btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-gift"></i> CLAIM COIN 8500';timer.style.display='none';return;}
      let hh=Math.floor(rem/3600000),mm=Math.floor(rem%3600000/60000),ss=Math.floor(rem%60000/1000);
      document.getElementById('tLeft').innerText=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    },1000);
    return true;
  }
  btn.disabled=false;
  btn.innerHTML='<i class="fa-solid fa-gift"></i> CLAIM COIN 8500';
  timer.style.display='none';
  return false;
}
window.handleClaim8500 = async () => {
  if(!uid){ alert("Telegram me kholo"); return; }
  if(bState()) return;
  try{
    const userRef = ref(db,'users/'+uid);
    const snap = await get(userRef);
    let realBal = snap.exists() ? (snap.val().balance||0) : 0;
    realBal += 8500;
    await set(userRef, { balance: realBal });
    document.getElementById('coinBal').innerText = realBal;
    localStorage.setItem('claim8500_lock_'+uid, (Date.now() + 86400000).toString());
    bState();
    tg.showPopup({ message: '8500 Coins Added!' });
  }catch(e){ alert('Error: '+e.message); }
}
</script>
