<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Redeem - SFA Earn</title>
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<link rel="stylesheet" href="earn.css">
<style>
.redeem-wrap{ padding:0 16px 30px 16px; }
.redeem-box{ background:#fff; border-radius:20px; padding:22px; margin-top:15px; box-shadow:0 10px 30px rgba(0,0,0,0.15); }
.redeem-box h2{ margin:0; text-align:center; font-size:22px; }
.balance-card{ background:#000; color:#fff; border-radius:14px; padding:14px; text-align:center; margin:15px 0; }
.balance-card b{ font-size:20px; }
.redeem-box input{ width:100%; padding:14px; margin:10px 0; border-radius:12px; border:1.5px solid #ddd; font-size:15px; box-sizing:border-box; }
.redeem-btn{ width:100%; padding:15px; background:#000; color:#fff; border:none; border-radius:12px; font-weight:bold; font-size:16px; margin-top:10px; }
.redeem-btn:active{ opacity:0.8; }
.info{ text-align:center; color:#666; font-size:13px; margin:8px 0; }
.rate-box{ background:#f6f6f6; border-radius:12px; padding:10px; text-align:center; font-size:13px; margin:10px 0; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="header">
  <div class="logo" onclick="window.location.href='earn.html'" style="cursor:pointer">← BACK</div>
  <div class="coin-pill">🪙 <span id="bal">0</span></div>
</div>

<div class="redeem-wrap">
  <div class="redeem-box">
    <h2>💸 Redeem Coins</h2>
    
    <div class="balance-card">
      Your Balance<br><b id="bal2">0</b> Coins
    </div>

    <div class="rate-box">
      Rate: <b>25000 Coins = ₹1</b><br>
      Min Redeem: <b>250000 Coins = ₹10</b>
    </div>
    
    <input type="text" id="upi" placeholder="Enter UPI ID (e.g. 9876543210@paytm)">
    <input type="number" id="amount" placeholder="Coins - Min 250000">

    <p class="info" id="calc">₹0.00</p>
    
    <button class="redeem-btn" onclick="doRedeem()">REDEEM NOW</button>
    <p class="info" id="msg"></p>
    <p class="info" style="margin-top:15px;">Payment will be done within 24 hours.<br>Check your UPI ID carefully.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, get, update, push } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBaxVAyNYG6v2Xs6_yF-Z_f1Tm3oftpQk",
  authDomain: "sfaearn.firebaseapp.com",
  databaseURL: "https://sfaearn-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sfaearn",
  appId: "1:451152021964:web:cf11961c89b9b7ec0f569"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const tg = window.Telegram.WebApp;
tg.expand();
tg.BackButton.show();
tg.BackButton.onClick(()=> window.location.href='earn.html');

const uid = tg.initDataUnsafe?.user?.id?.toString() || "test_123";
let bal=0;

async function init(){
  const snap = await get(ref(db,'users/'+uid));
  if(snap.exists()) bal = snap.val().balance || 0;
  document.getElementById('bal').innerText=bal;
  document.getElementById('bal2').innerText=bal;
}
init();

document.getElementById('amount').addEventListener('input', (e)=>{
  const coins = parseInt(e.target.value) || 0;
  const rs = (coins / 25000).toFixed(2);
  document.getElementById('calc').innerText = `You will get: ₹${rs}`;
});

window.doRedeem = async () => {
  const upi = document.getElementById('upi').value.trim();
  const coins = parseInt(document.getElementById('amount').value);
  const msg = document.getElementById('msg');
  
  if(!upi.includes('@')){ msg.innerText='❌ Valid UPI ID dalo'; return; }
  if(isNaN(coins) || coins < 250000){ msg.innerText='❌ Minimum 250000 Coins'; return; }
  if(coins > bal){ msg.innerText='❌ Balance kam hai, '+bal+' hi hai'; return; }
  
  msg.innerText='Processing...';
  
  try{
    bal -= coins;
    await update(ref(db,'users/'+uid),{balance:bal});
    await push(ref(db,'redeems'),{
      uid: uid,
      username: tg.initDataUnsafe?.user?.username || '',
      upi: upi,
      coins: coins,
      rupees: coins/25000,
      status: 'pending',
      time: Date.now()
    });
    
    document.getElementById('bal').innerText=bal;
    document.getElementById('bal2').innerText=bal;
    msg.innerText='✅ Request sent! 24H me payment hoga';
    tg.showPopup({message: 'Redeem request sent! ₹'+(coins/25000)+' will be paid in 24H'});
    document.getElementById('amount').value='';
  }catch(err){
    msg.innerText='❌ Error, try again';
  }
}
</script>
</body>
</html>
