<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Blast</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11215599' data-sdk='show_11215599'></script>
<link rel="stylesheet" href="block.css">
</head>
  <div data-abx-banner="3c76eab41644" data-abx-w="320" data-abx-h="50" style="display:inline-block;width:320px;height:50px;line-height:0"></div>
<script async src="https://sdk.adsbitvex.com/functions/v1/banner-serve?action=sdk"></script>
<body>
<div id="levelScreen">
  <div class="top"><span>🧱 Block Blast</span><div class="scores"><span>High: <b id="highTxt">1</b></span> <span>Total: <b id="totalTxt">0</b></span></div></div>
  <div class="progress-bg"><div id="overallProgress" class="progress"></div></div>
  <div class="level-grid" id="levelGrid"></div>
</div>

<div id="gameScreen" class="hidden">
  <div class="top"><button class="back" onclick="showLevels()">← Levels</button><div class="scores">Lv <b id="level">1</b> | Score <b id="score">0</b></div></div>
  <div class="stats"><span>Target: <b id="targetTxt">0/300</b></span><span>Next: <b id="nextTxt">300</b></span></div>
  <div class="progress-bg"><div id="progress" class="progress"></div></div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="tray" id="tray"></div>
  <div class="actions"><button class="ad-btn" onclick="watchAd()">📺 Watch Ad +500</button><button class="reset-btn" onclick="resetLevel()">↻ Reset</button></div>
</div>
<script src="block.js"></script>
  <script>
  // 1. Telegram WebApp Back Button
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.BackButton.show();
    Telegram.WebApp.BackButton.onClick(() => {
      window.location.href = 'index.html';
    });
  }

  // 2. Browser / Android Back Button
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', function() {
    window.location.href = 'index.html';
  });

  // 3. Tera jo header ka back button hai uske liye
  document.querySelector('.back').addEventListener('click', function(e){
    e.preventDefault();
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
