<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Blast</title>
<link rel="stylesheet" href="block.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- RichAds -->
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  try {
    if(window.parent && window.parent.TelegramAdsController){
      window.TelegramAdsController = window.parent.TelegramAdsController;
    } else {
      window.TelegramAdsController = new TelegramAdsController();
      window.TelegramAdsController.initialize({ pubId: "1013423", appId: "7744" });
    }
  } catch(e){}
</script>

<!-- Monetag -->
<script>
  if(window.parent && window.parent.show_11215599){
    window.show_11215599 = window.parent.show_11215599;
  }
</script>
<script src="https://libtl.com/sdk.js" data-zone="11215599" data-sdk="show_11215599"></script>
</head>
<body>

<div id="levelScreen" class="main">
  <h1>BLOCK<span>BLAST</span></h1>
  <p class="subtitle">Select Level - <span id="highTxt">1</span> / Total: <span id="totalTxt">0</span></p>
  <div class="progress-bar"><div id="overallProgress"></div></div>
  <div class="back-wrapper-middle">
    <button class="back-btn-pro-middle" onclick="if(window.parent && window.parent.closeGame) window.parent.closeGame(); else window.location.href='index.html'">← Back</button>
  </div>
  <div id="levelGrid"></div>
</div>

<div id="gameScreen" class="main hidden">
  <div class="top">
    <button class="back-btn" onclick="showLevels()">← LEVELS</button>
    <div class="score-box"><div class="label">SCORE</div><div><span id="score">0</span> / <span id="nextTxt">300</span></div></div>
  </div>
  <div class="level-info-bar">LEVEL <b id="level">1</b> - <span id="targetTxt">0/300</span></div>
  <div class="progress-bar"><div id="progress"></div></div>
  <div id="board"></div>
  <div id="tray"></div>
  <div class="next-card"><button onclick="resetLevel()">RESTART</button> <button onclick="watchAd()">+500 AD</button></div>
</div>

<script src="block.js"></script>
</body>
</html>
