<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Puzzle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>
<script>
  window.showRewarded = null;
  window.showInterstitial = null;
  // 6152853 = Rewarded - +500 & 5th level unlock
  window.initCdTma?.({ id: '6152853' }).then(show => window.showRewarded = show).catch(e=>console.log(e));
  // 6152854 = Interstitial - har 2 level pe
  window.initCdTma?.({ id: '6152854' }).then(show => window.showInterstitial = show).catch(e=>console.log(e));
</script>
<link rel="stylesheet" href="block.css">
</head>
<body>

<!-- LEVEL SCREEN -->
<div id="levelScreen">
  <div class="top">
    <span>Block Puzzle</span>
    <div class="scores"><span>High: <b id="highTxt">1</b></span> <span>Total: <b id="totalTxt">0</b></span></div>
  </div>
  <div class="progress-bg"><div id="overallProgress" class="progress" style="width:1%"></div></div>
  <div class="level-grid" id="levelGrid"></div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="hidden">
  <div class="top">
    <button class="back" onclick="showLevels()">← Levels</button>
    <div class="scores">Lv <b id="level">1</b> | Score <b id="score">0</b></div>
  </div>
  <div class="stats">
    <span>Target: <b id="targetTxt">0/500</b></span>
    <span>Next Unlock: <b id="nextTxt">500</b></span>
  </div>
  <div class="progress-bg"><div id="progress" class="progress"></div></div>

  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="tray" id="tray"></div>

  <div class="actions">
    <button class="ad-btn" onclick="watchAd()">📺 Watch Ad +500</button>
    <button class="reset-btn" onclick="resetLevel()">↻ Reset</button>
  </div>
</div>

<script src="block.js"></script>
</body>
</html>
