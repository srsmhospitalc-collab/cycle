<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arrow Puzzle 100</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  window.TelegramAdsController = new TelegramAdsController();
  window.TelegramAdsController.initialize({
    pubId: "1013423",
    appId: "7744",
    debug: false
  });
</script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; min-height: 100vh; }
.container { max-width: 400px; margin: 0 auto; padding: 15px; }
.screen { display: none; text-align: center; }
.screen.active { display: block; }
.btn { background: linear-gradient(135deg, #8b5cf6, #7c3aed); border: none; padding: 18px 40px; border-radius: 15px; color: white; font-size: 20px; font-weight: 700; cursor: pointer; margin: 10px; width: 85%; }
.btn-small { padding: 10px 20px; font-size: 16px; width: auto; }
    h1 { font-size: 42px; margin: 30px 0 10px; background: linear-gradient(135deg, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 12px 16px; background: rgba(30,41,59,0.6); border-radius: 12px; }
.game-grid { display: grid; gap: 4px; margin: 15px auto; padding: 10px; background: rgba(30,41,59,0.4); border-radius: 15px; max-width: 360px; }
.cell { aspect-ratio: 1; background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
.cell.block { background: #475569; cursor: not-allowed; }
.cell.arrow { background: #8b5cf6; }
.cell.target { background: #10b981; }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 55vh; overflow-y: auto; padding: 10px; }
.level-btn { aspect-ratio: 1; background: #334155; border: 2px solid #475569; border-radius: 10px; color: #94a3b8; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.level-btn.unlocked { background: #8b5cf6; border-color: #7c3aed; color: white; }
.level-btn.current { background: #10b981; border-color: #059669; }
.level-btn.locked { opacity: 0.4; cursor: not-allowed; }
.stats { display: flex; justify-content: space-around; margin: 20px 0; color: #94a3b8; }
</style>
</head>
<body>
<div class="container">
    <div id="homeScreen" class="screen active">
        <h1>ARROW PUZZLE</h1>
        <p style="color:#94a3b8;margin-bottom:40px">100 Challenging Levels</p>
        <div class="stats">
            <div>🏆 Highest<br><b id="maxLevel">1</b></div>
            <div>⭐ Total Moves<br><b id="totalMoves">0</b></div>
        </div>
        <button class="btn" onclick="showLevelSelect()">▶ PLAY GAME</button>
    </div>

    <div id="levelScreen" class="screen">
        <h2 style="margin-bottom:15px">SELECT LEVEL</h2>
        <div class="level-grid" id="levelGrid"></div>
        <button class="btn btn-small" onclick="showHome()">⬅ BACK</button>
    </div>

    <div id="gameScreen" class="screen">
        <div class="header">
            <button onclick="showLevelSelect()" style="background:none;border:none;color:#94a3b8;font-size:24px">←</button>
            <div>Level <span id="levelNum">1</span>/100</div>
            <div>Moves: <span id="moves">0</span></div>
        </div>
        <div class="game-grid" id="gameGrid"></div>
        <p style="color:#94a3b8;margin:10px 0">Reach 🎯 to win</p>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

let currentLevel = 1, maxUnlocked = 1, totalMoves = 0, grid = [], arrowPos = {x: 0, y: 0}, moves = 0, gridSize = 5;
let canShowAd = true; // AD LOCK SYSTEM

function loadGame() {
    try {
        const saved = localStorage.getItem('arrowPuzzle100');
        if(saved) { const data = JSON.parse(saved); maxUnlocked = data.maxUnlocked || 1; totalMoves = data.totalMoves || 0; }
    } catch(e) {}
    document.getElementById('maxLevel').textContent = maxUnlocked;
    document.getElementById('totalMoves').textContent = totalMoves;
}

function saveGame() {
    try { localStorage.setItem('arrowPuzzle100', JSON.stringify({ maxUnlocked: maxUnlocked, totalMoves: totalMoves })); } catch(e) {}
}

function generateLevel(lvl) {
    gridSize = Math.min(5 + Math.floor((lvl-1) / 20), 9);
    const blockCount = Math.min(3 + Math.floor(lvl / 3), 25);
    grid = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
    let blocks = 0;
    while(blocks < blockCount) {
        const x = Math.floor(Math.random() * gridSize), y = Math.floor(Math.random() * gridSize);
        if(grid[y][x] === 0 &&!(x === 0 && y === 0) &&!(x === gridSize-1 && y === gridSize-1)) { grid[y][x] = 1; blocks++; }
    }
    arrowPos = {x: 0, y: 0}; grid[0][0] = 2; grid[gridSize-1][gridSize-1] = 3; moves = 0;
}

function renderGrid() {
    const gameGrid = document.getElementById('gameGrid');
    gameGrid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    gameGrid.innerHTML = '';
    for(let y = 0; y < gridSize; y++) {
        for(let x = 0; x < gridSize; x++) {
            const cell = document.createElement('div'); cell.className = 'cell';
            if(grid[y][x] === 1) { cell.className += ' block'; cell.textContent = '⬛'; }
            else if(grid[y][x] === 2) { cell.className += ' arrow'; cell.textContent = '➡️'; }
            else if(grid[y][x] === 3) { cell.className += ' target'; cell.textContent = '🎯'; }
            cell.onclick = () => moveArrow(x, y); gameGrid.appendChild(cell);
        }
    }
    document.getElementById('moves').textContent = moves;
    document.getElementById('levelNum').textContent = currentLevel;
}

function moveArrow(x, y) {
    if(grid[y][x] === 1) return;
    const dx = Math.sign(x - arrowPos.x), dy = Math.sign(y - arrowPos.y);
    if(dx!== 0 && dy!== 0 || dx === 0 && dy === 0) return;
    let cx = arrowPos.x, cy = arrowPos.y;
    while(cx!== x || cy!== y) { cx += dx; cy += dy; if(grid[cy][cx] === 1) return; }
    grid[arrowPos.y][arrowPos.x] = 0; arrowPos = {x, y}; moves++; totalMoves++;
    if(grid[y][x] === 3) winLevel(); else { grid[y][x] = 2; renderGrid(); }
}

// AD SYSTEM - 100% CONTROL
function winLevel() {
    tg.HapticFeedback.notificationOccurred('success');
    if(currentLevel === maxUnlocked && currentLevel < 100) {
        maxUnlocked++; saveGame();
        document.getElementById('maxLevel').textContent = maxUnlocked;
        document.getElementById('totalMoves').textContent = totalMoves;
    }

    // SIRF LEVEL 2,4,6... PE AUR 30 SEC BAAD HI AD
    if(currentLevel % 2 === 0 && canShowAd) {
        console.log('Ad dikha raha hu Level', currentLevel);
        canShowAd = false; // LOCK LAGA DIYA
        setTimeout(() => { canShowAd = true; console.log('Ad lock khul gaya'); }, 30000); // 30 sec baad unlock

        window.TelegramAdsController.triggerInterstitialBanner().then(() => {
            nextLevelLoad();
        }).catch(() => { nextLevelLoad(); });
    } else {
        tg.showAlert(`Level ${currentLevel} Complete! 🎉`);
        nextLevelLoad();
    }
}

function nextLevelLoad() {
    if(currentLevel < 100) { currentLevel++; startLevel(currentLevel); }
    else { tg.showAlert('🏆 All 100 Levels Complete!'); showHome(); }
}

function showHome() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('homeScreen').classList.add('active');
}

function showLevelSelect() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('levelScreen').classList.add('active'); renderLevelGrid();
}

function renderLevelGrid() {
    const grid = document.getElementById('levelGrid'); grid.innerHTML = '';
    for(let i = 1; i <= 100; i++) {
        const btn = document.createElement('div'); btn.className = 'level-btn'; btn.textContent = i;
        if(i <= maxUnlocked) { btn.className += ' unlocked'; if(i === currentLevel) btn.className += ' current'; btn.onclick = () => startLevel(i); }
        else { btn.className += ' locked'; }
        grid.appendChild(btn);
    }
}

function startLevel(lvl) {
    currentLevel = lvl; generateLevel(lvl);
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('gameScreen').classList.add('active'); renderGrid();
}

loadGame();
tg.BackButton.onClick(showLevelSelect);
</script>
</body>
</html>
