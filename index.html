<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>One Line Maze 100</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  try {
    window.TelegramAdsController = new TelegramAdsController();
    window.TelegramAdsController.initialize({
      pubId: "1013423",
      appId: "7744",
      debug: false
    });
  } catch(e) {}
</script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #fff; color: #000; min-height: 100vh; overflow: hidden; }
.container { max-width: 420px; margin: 0 auto; padding: 10px; }
.screen { display: none; }
.screen.active { display: block; }
    
.game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 10px 5px; position: relative; }
.icon-btn { width: 45px; height: 45px; border-radius: 50%; background: #4a90e2; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
.level-badge { background: #4a90e2; color: white; padding: 12px 35px; border-radius: 25px; font-size: 18px; font-weight: 700; }
.top-right-icons { display: flex; flex-direction: column; gap: 8px; }
.color-wheel { width: 45px; height: 45px; border-radius: 50%; background: conic-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000); }
.lives { text-align: center; font-size: 22px; margin: 5px 0 15px; letter-spacing: 8px; }
.lives.lost { animation: shake 0.3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    
.maze-wrapper { position: relative; width: 100%; height: 60vh; background: #fff; display: flex; align-items: center; justify-content: center; }
#mazeCanvas { width: 100%; height: 100%; touch-action: none; }
    
.bottom-bar { display: flex; justify-content: space-between; margin-top: 25px; padding: 0 40px; }
.circle-btn { width: 60px; height: 60px; border-radius: 50%; background: #e8e8e8; border: none; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #999; }
.hint-btn { background: #ffc107; color: #fff; position: relative; }
.hint-btn::after {
        content: '▶';
        position: absolute;
        top: -5px;
        right: -5px;
        background: #4caf50;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
.btn { background: #4a90e2; border: none; padding: 18px 40px; border-radius: 15px; color: white; font-size: 20px; font-weight: 700; cursor: pointer; margin: 10px; width: 85%; }
    h1 { font-size: 42px; margin: 30px 0 10px; color: #4a90e2; text-align: center; }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 60vh; overflow-y: auto; padding: 10px; margin: 20px 0; }
.level-btn { aspect-ratio: 1; background: #e0e0e0; border: 2px solid #ccc; border-radius: 10px; color: #666; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.level-btn.unlocked { background: #4a90e2; border-color: #357abd; color: white; }
.level-btn.current { background: #10b981; border-color: #059669; }
.level-btn.locked { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
    <div id="homeScreen" class="screen active">
        <h1>ONE LINE MAZE</h1>
        <p style="color:#666;margin-bottom:40px;text-align:center">100 Challenging Levels</p>
        <div style="text-align:center">
            <button class="btn" onclick="showLevelSelect()">▶ PLAY GAME</button>
        </div>
    </div>

    <div id="levelScreen" class="screen">
        <h2 style="margin-bottom:15px;text-align:center;color:#4a90e2">SELECT LEVEL</h2>
        <div class="level-grid" id="levelGrid"></div>
        <div style="text-align:center">
            <button class="btn" onclick="showHome()">⬅ BACK</button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button class="icon-btn" onclick="showLevelSelect()">←</button>
            <div class="level-badge">Level <span id="levelNum">1</span></div>
            <div class="top-right-icons">
                <button class="icon-btn">⚙️</button>
                <div class="color-wheel"></div>
            </div>
        </div>
        <div class="lives" id="livesDisplay">❤️❤️❤️</div>
        
        <div class="maze-wrapper">
            <canvas id="mazeCanvas"></canvas>
        </div>
        
        <div class="bottom-bar">
            <button class="circle-btn" onclick="restartLevel()">🔄</button>
            <button class="circle-btn hint-btn" onclick="showHint()">💡</button>
        </div>
    </div>
</div>

<script>
let tg = null;
try {
    tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
} catch(e) {
    tg = { HapticFeedback: { notificationOccurred: () => {} }, showAlert: (msg) => alert(msg), BackButton: { onClick: () => {} } };
}

let currentLevel = 1, maxUnlocked = 1, canShowAd = true;
let canvas, ctx, isDrawing = false, lives = 3;
let mazePath = [], userPath = [], coveredPaths = [], currentSegment = 0;

// Level 42 ka exact pattern image se
const LEVELS = {
    1: {
        segments: [
            {x1: 50, y1: 300, x2: 50, y2: 250, dir: 'up'},
            {x1: 50, y1: 250, x2: 100, y2: 250, dir: 'right'},
            {x1: 100, y1: 250, x2: 100, y2: 200, dir: 'up'},
            {x1: 100, y1: 200, x2: 150, y2: 200, dir: 'right'},
            {x1: 150, y1: 200, x2: 150, y2: 250, dir: 'down'}
        ]
    },
    42: { // Image wala pattern
        segments: [
            // Top section
            {x1: 60, y1: 320, x2: 60, y2: 240, dir: 'up'},
            {x1: 60, y1: 240, x2: 100, y2: 240, dir: 'right'},
            {x1: 100, y1: 240, x2: 100, y2: 200, dir: 'up'},
            {x1: 100, y1: 200, x2: 80, y2: 200, dir: 'left'},
            {x1: 80, y1: 200, x2: 80, y2: 160, dir: 'up'},
            {x1: 80, y1: 160, x2: 120, y2: 160, dir: 'right'},
            {x1: 120, y1: 160, x2: 120, y2: 200, dir: 'down'},
            {x1: 120, y1: 200, x2: 140, y2: 200, dir: 'right'},
            {x1: 140, y1: 200, x2: 140, y2: 240, dir: 'down'},
            {x1: 140, y1: 240, x2: 180, y2: 240, dir: 'right'},
            {x1: 180, y1: 240, x2: 180, y2: 280, dir: 'down'},
            
            // Right top
            {x1: 220, y1: 320, x2: 220, y2: 200, dir: 'up'},
            {x1: 220, y1: 200, x2: 260, y2: 200, dir: 'right'},
            {x1: 260, y1: 200, x2: 260, y2: 240, dir: 'down'},
            {x1: 260, y1: 240, x2: 300, y2: 240, dir: 'right'},
            {x1: 300, y1: 240, x2: 300, y2: 200, dir: 'up'},
            {x1: 300, y1: 200, x2: 280, y2: 200, dir: 'left'},
            {x1: 280, y1: 200, x2: 280, y2: 160, dir: 'up'},
            {x1: 280, y1: 160, x2: 240, y2: 160, dir: 'left'},
            
            // Bottom section
            {x1: 60, y1: 120, x2: 60, y2: 80, dir: 'up'},
            {x1: 60, y1: 80, x2: 100, y2: 80, dir: 'right'},
            {x1: 100, y1: 80, x2: 100, y2: 120, dir: 'down'},
            {x1: 100, y1: 120, x2: 140, y2: 120, dir: 'right'},
            {x1: 140, y1: 120, x2: 140, y2: 80, dir: 'up'},
            {x1: 140, y1: 80, x2: 180, y2: 80, dir: 'right'},
            {x1: 180, y1: 80, x2: 180, y2: 120, dir: 'down'},
            {x1: 180, y1: 120, x2: 220, y2: 120, dir: 'right'},
            {x1: 220, y1: 120, x2: 220, y2: 80, dir: 'up'},
            {x1: 220, y1: 80, x2: 260, y2: 80, dir: 'right'},
            {x1: 260, y1: 80, x2: 260, y2: 120, dir: 'down'},
            {x1: 260, y1: 120, x2: 300, y2: 120, dir: 'right'}
        ]
    }
};

function initCanvas() {
    canvas = document.getElementById('mazeCanvas');
    ctx = canvas.getContext('2d');
    
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', drawing);
    canvas.addEventListener('touchend', endDraw);
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', drawing);
    canvas.addEventListener('mouseup', endDraw);
    
    setupLevel();
}

function setupLevel() {
    const level = LEVELS[currentLevel] || LEVELS[42];
    mazePath = level.segments.map(s => ({...s, covered: false}));
    userPath = [];
    coveredPaths = [];
    currentSegment = 0;
    lives = 3;
    updateLives();
    render();
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches? e.touches[0].clientX : e.clientX;
    const clientY = e.touches? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

function startDraw(e) {
    e.preventDefault();
    const pos = getPos(e);
    const firstSeg = mazePath[0];
    
    // Start point ke paas hai kya
    if(Math.abs(pos.x - firstSeg.x1) < 20 && Math.abs(pos.y - firstSeg.y1) < 20) {
        isDrawing = true;
        userPath = [pos];
        currentSegment = 0;
    }
}

function drawing(e) {
    if(!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    userPath.push(pos);
    
    // Check karo current segment follow kar raha hai kya
    if(currentSegment < mazePath.length) {
        const seg = mazePath[currentSegment];
        const progress = getSegmentProgress(pos, seg);
        
        if(progress > 0.9) {
            // Segment complete
            seg.covered = true;
            coveredPaths.push(seg);
            currentSegment++;
            
            if(currentSegment >= mazePath.length) {
                // Win!
                setTimeout(winLevel, 300);
                isDrawing = false;
            }
        } else if(progress < 0) {
            // Galat direction - heart kam
            isDrawing = false;
            loseLife();
            userPath = [];
            mazePath.forEach(s => s.covered = false);
            coveredPaths = [];
            currentSegment = 0;
        }
    }
    
    render();
}

function getSegmentProgress(pos, seg) {
    // Kitna percent segment cover hua
    const dx = seg.x2 - seg.x1;
    const dy = seg.y2 - seg.y1;
    const len = Math.hypot(dx, dy);
    
    if(len === 0) return 1;
    
    // Project point onto line
    const t = ((pos.x - seg.x1) * dx + (pos.y - seg.y1) * dy) / (len * len);
    
    if(t < 0) return -1; // Galat direction
    if(t > 1) return 1; // Complete
    
    // Distance from line
    const projX = seg.x1 + t * dx;
    const projY = seg.y1 + t * dy;
    const dist = Math.hypot(pos.x - projX, pos.y - projY);
    
    if(dist > 25) return -1; // Bahut door hai line se
    
    return t;
}

function endDraw(e) {
    if(!isDrawing) return;
    isDrawing = false;
    
    // Agar complete nahi hua to reset
    if(currentSegment < mazePath.length) {
        userPath = [];
        mazePath.forEach(s => s.covered = false);
        coveredPaths = [];
        currentSegment = 0;
        render();
    }
}

function drawArrow(x1, y1, x2, y2, color, width) {
    const headlen = 12;
    const angle = Math.atan2(y2 - y1, x2 - x1);
    
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Line
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    
    // Arrow head
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI/6), y2 - headlen * Math.sin(angle - Math.PI/6));
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI/6), y2 - headlen * Math.sin(angle + Math.PI/6));
    ctx.stroke();
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw uncovered maze segments - BLACK
    mazePath.forEach(seg => {
        if(!seg.covered) {
            drawArrow(seg.x1, seg.y1, seg.x2, seg.y2, '#000', 6);
        }
    });
    
    // Draw covered segments - GRAY
    coveredPaths.forEach(seg => {
        drawArrow(seg.x1, seg.y1, seg.x2, seg.y2, '#999', 6);
    });
    
    // Draw user path
    if(userPath.length > 1) {
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(userPath[0].x, userPath[0].y);
        for(let i = 1; i < userPath.length; i++) {
            ctx.lineTo(userPath[i].x, userPath[i].y);
        }
        ctx.stroke();
    }
    
    document.getElementById('levelNum').textContent = currentLevel;
}

function loseLife() {
    lives--;
    updateLives();
    const livesEl = document.getElementById('livesDisplay');
    livesEl.classList.add('lost');
    setTimeout(() => livesEl.classList.remove('lost'), 300);
    tg.HapticFeedback.notificationOccurred('error');
    
    if(lives <= 0) {
        setTimeout(() => {
            tg.showAlert('Game Over! 💔');
            restartLevel();
        }, 500);
    }
}

function updateLives() {
    document.getElementById('livesDisplay').textContent = '❤️'.repeat(lives);
}

function winLevel() {
    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
    
    if(currentLevel === maxUnlocked && currentLevel < 100) {
        maxUnlocked++; saveGame();
    }

    if(currentLevel % 2 === 0 && canShowAd) {
        canShowAd = false;
        setTimeout(() => { canShowAd = true; }, 30000);
        try {
            window.TelegramAdsController.triggerInterstitialBanner().then(nextLevelLoad).catch(nextLevelLoad);
        } catch(e) { nextLevelLoad(); }
    } else {
        nextLevelLoad();
    }
}

function nextLevelLoad() {
    if(currentLevel < 100) { 
        currentLevel++; 
        startLevel(currentLevel); 
    } else { 
        tg.showAlert('🏆 All 100 Levels Complete!'); 
        showHome(); 
    }
}

function restartLevel() {
    setupLevel();
}

function showHint() {
    tg.showAlert('Hint: Start point se line kheecho aur arrows follow karo!');
}

function showHome() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('homeScreen').classList.add('active');
}

function showLevelSelect() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('levelScreen').classList.add('active'); 
    renderLevelGrid();
}

function renderLevelGrid() {
    const grid = document.getElementById('levelGrid'); 
    grid.innerHTML = '';
    for(let i = 1; i <= 100; i++) {
        const btn = document.createElement('div'); 
        btn.className = 'level-btn'; 
        btn.textContent = i;
        if(i <= maxUnlocked) { 
            btn.className += ' unlocked'; 
            if(i === currentLevel) btn.className += ' current'; 
            btn.onclick = () => startLevel(i); 
        } else { 
            btn.className += ' locked'; 
        }
        grid.appendChild(btn);
    }
}

function startLevel(lvl) {
    currentLevel = lvl; 
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('gameScreen').classList.add('active'); 
    setTimeout(() => {
        initCanvas();
    }, 100);
}

function saveGame() {
    try { localStorage.setItem('oneLineMaze100', JSON.stringify({ maxUnlocked: maxUnlocked })); } catch(e) {}
}

function loadGame() {
    try {
        const saved = localStorage.getItem('oneLineMaze100');
        if(saved) maxUnlocked = JSON.parse(saved).maxUnlocked || 1;
    } catch(e) {}
}

loadGame();
try { tg.BackButton.onClick(showLevelSelect); } catch(e) {}
</script>
</body>
</html>
