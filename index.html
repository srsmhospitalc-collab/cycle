<body>
<div class="container">
    <div id="homeScreen" class="screen active">
        <h1>SFA Games</h1>
        <p style="color:#666;margin-bottom:40px;text-align:center;font-size:16px">PLAY & FUN</p>
        <div style="text-align:center">
            <button class="btn" onclick="showLevelSelect()">Ball Sort</button>

        <div class="moves">Moves: <span id="moveCount">0</span></div>
        <div class="tubes-container" id="tubesContainer"></div>
        <div class="bottom-bar">
