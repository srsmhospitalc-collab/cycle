<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arrow Escape 100</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  try {
    window.TelegramAdsController = new TelegramAdsController();
    window.TelegramAdsController.initialize({
      pubId: "1013423",
      appId: "7744",
      debug: false
    });
  } catch(e) {}
</script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #fff; color: #000; min-height: 100vh; overflow: hidden; }
.container { max-width: 420px; margin: 0 auto; padding: 10px; }
.screen { display: none; }
.screen.active { display: block; }
    
.game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 10px 5px; }
.icon-btn { width: 45px; height: 45px; border-radius: 50%; background: #4a90e2; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
.level-badge { background: #4a90e2; color: white; padding: 12px 35px; border-radius: 25px; font-size: 18px; font-weight: 700; }
.top-right-icons { display: flex; flex-direction: column; gap: 8px; }
.color-wheel { width: 45px; height: 45px; border-radius: 50%; background: conic-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000); }
.lives { text-align: center; font-size: 28px; margin: 5px 0 15px; letter-spacing: 8px; }
.lives.lost { animation: shake 0.3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    
.game-area { position: relative; width: 100%; height: 60vh; background: #f8f8f8; border: 3px solid #ddd; border-radius: 15px; overflow: hidden; }
.arrow {
        position: absolute;
        width: 50px;
        height: 50px;
        background: #333;
        clip-path: polygon(0% 40%, 60% 40%, 60% 20%, 100% 50%, 60% 80%, 60% 60%, 0% 60%);
        cursor: pointer;
        transition: transform 0.1s;
        z-index: 5;
    }
.arrow:active { transform: scale(0.9); }
.arrow.moving { transition: all 0.8s linear; z-index: 10; }
.arrow.removed { opacity: 0; pointer-events: none; }
    
.bottom-bar { display: flex; justify-content: space-between; margin-top: 25px; padding: 0 40px; }
.circle-btn { width: 60px; height: 60px; border-radius: 50%; background: #e8e8e8; border: none; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #999; }
.hint-btn { background: #ffc107; color: #fff; position: relative; }
.hint-btn::after {
        content: '▶';
        position: absolute;
        top: -5px;
        right: -5px;
        background: #4caf50;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
.btn { background: #4a90e2; border: none; padding: 18px 40px; border-radius: 15px; color: white; font-size: 20px; font-weight: 700; cursor: pointer; margin: 10px; width: 85%; }
    h1 { font-size: 42px; margin: 30px 0 10px; color: #4a90e2; text-align: center; }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 60vh; overflow-y: auto; padding: 10px; margin: 20px 0; }
.level-btn { aspect-ratio: 1; background: #e0e0e0; border: 2px solid #ccc; border-radius: 10px; color: #666; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.level-btn.unlocked { background: #4a90e2; border-color: #357abd; color: white; }
.level-btn.current { background: #10b981; border-color: #059669; }
.level-btn.locked { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
    <div id="homeScreen" class="screen active">
        <h1>ARROW ESCAPE</h1>
        <p style="color:#666;margin-bottom:40px;text-align:center">100 Tangled Levels</p>
        <div style="text-align:center">
            <button class="btn" onclick="showLevelSelect()">▶ PLAY GAME</button>
        </div>
    </div>

    <div id="levelScreen" class="screen">
        <h2 style="margin-bottom:15px;text-align:center;color:#4a90e2">SELECT LEVEL</h2>
        <div class="level-grid" id="levelGrid"></div>
        <div style="text-align:center">
            <button class="btn" onclick="showHome()">⬅ BACK</button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button class="icon-btn" onclick="showLevelSelect()">←</button>
            <div class="level-badge">Level <span id="levelNum">1</span></div>
            <div class="top-right-icons">
                <button class="icon-btn">⚙️</button>
                <div class="color-wheel"></div>
            </div>
        </div>
        <div class="lives" id="livesDisplay">❤️❤️❤️</div>
        
        <div class="game-area" id="gameArea"></div>
        
        <div class="bottom-bar">
            <button class="circle-btn" onclick="restartLevel()">🔄</button>
            <button class="circle-btn hint-btn" onclick="showHint()">💡</button>
        </div>
    </div>
</div>

<script>
let tg = null;
try {
    tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
} catch(e) {
    tg = { HapticFeedback: { notificationOccurred: () => {} }, showAlert: (msg) => alert(msg), BackButton: { onClick: () => {} } };
}

let currentLevel = 1, maxUnlocked = 1, canShowAd = true;
let arrows = [], lives = 3, gameArea = null;

// Level designs - teer ki position + direction
const LEVELS = {
    1: [ // Easy - 4 teer
        {x: 150, y: 150, dir: 'right'},
        {x: 200, y: 150, dir: 'down'},
        {x: 200, y: 200, dir: 'left'},
        {x: 150, y: 200, dir: 'up'}
    ],
    2: [ // Medium - 6 teer uljhe hue
        {x: 100, y: 100, dir: 'right'},
        {x: 200, y: 100, dir: 'down'},
        {x: 200, y: 200, dir: 'left'},
        {x: 100, y: 200, dir: 'up'},
        {x: 150, y: 150, dir: 'right'},
        {x: 180, y: 180, dir: 'up'}
    ],
    3: [ // Hard - 8 teer
        {x: 80, y: 80, dir: 'right'}, {x: 160, y: 80, dir: 'down'},
        {x: 240, y: 80, dir: 'left'}, {x: 80, y: 160, dir: 'down'},
        {x: 160, y: 160, dir: 'up'}, {x: 240, y: 160, dir: 'right'},
        {x: 120, y: 240, dir: 'up'}, {x: 200, y: 240, dir: 'left'}
    ]
};

function generateLevel(lvl) {
    // Level 1-3 hand made, baaki random
    if(LEVELS[lvl]) {
        arrows = LEVELS[lvl].map((a, i) => ({...a, id: i, removed: false}));
    } else {
        // Random 5-12 teer
        const count = Math.min(5 + Math.floor(lvl/10), 12);
        arrows = [];
        const dirs = ['up','down','left','right'];
        for(let i = 0; i < count; i++) {
            arrows.push({
                id: i,
                x: 60 + Math.random() * 240,
                y: 60 + Math.random() * 240,
                dir: dirs[Math.floor(Math.random()*4)],
                removed: false
            });
        }
    }
    lives = 3;
    updateLives();
    renderArrows();
}

function renderArrows() {
    gameArea = document.getElementById('gameArea');
    gameArea.innerHTML = '';
    
    arrows.forEach(arrow => {
        if(arrow.removed) return;
        
        const el = document.createElement('div');
        el.className = 'arrow';
        el.id = 'arrow-' + arrow.id;
        el.style.left = arrow.x + 'px';
        el.style.top = arrow.y + 'px';
        
        // Direction ke hisaab se rotate
        if(arrow.dir === 'up') el.style.transform = 'rotate(-90deg)';
        if(arrow.dir === 'down') el.style.transform = 'rotate(90deg)';
        if(arrow.dir === 'left') el.style.transform = 'rotate(180deg)';
        if(arrow.dir === 'right') el.style.transform = 'rotate(0deg)';
        
        el.onclick = () => shootArrow(arrow.id);
        gameArea.appendChild(el);
    });
    
    document.getElementById('levelNum').textContent = currentLevel;
}

function shootArrow(id) {
    const arrow = arrows.find(a => a.id === id);
    if(!arrow || arrow.removed) return;
    
    const el = document.getElementById('arrow-' + id);
    el.classList.add('moving');
    
    // Move direction me
    const speed = 400; // pixels
    let newX = arrow.x, newY = arrow.y;
    
    if(arrow.dir === 'right') newX += speed;
    if(arrow.dir === 'left') newX -= speed;
    if(arrow.dir === 'up') newY -= speed;
    if(arrow.dir === 'down') newY += speed;
    
    el.style.left = newX + 'px';
    el.style.top = newY + 'px';
    
    // Collision check - 400ms baad
    setTimeout(() => {
        const hit = checkCollision(arrow, newX, newY);
        
        if(hit) {
            // Takra gaya - wapas jao + heart kam
            el.style.left = arrow.x + 'px';
            el.style.top = arrow.y + 'px';
            el.classList.remove('moving');
            loseLife();
            tg.HapticFeedback.notificationOccurred('error');
        } else {
            // Bahar nikal gaya - gayab
            arrow.removed = true;
            el.classList.add('removed');
            tg.HapticFeedback.notificationOccurred('success');
            checkWin();
        }
    }, 800);
}

function checkCollision(movingArrow, newX, newY) {
    // Check karo kisi dusre teer se takraya kya
    return arrows.some(a => {
        if(a.id === movingArrow.id || a.removed) return false;
        
        // Simple box collision
        const dist = Math.hypot(newX - a.x, newY - a.y);
        return dist < 50; // 50px ke andar to collision
    });
}

function loseLife() {
    lives--;
    updateLives();
    const livesEl = document.getElementById('livesDisplay');
    livesEl.classList.add('lost');
    setTimeout(() => livesEl.classList.remove('lost'), 300);
    
    if(lives <= 0) {
        setTimeout(() => {
            tg.showAlert('Game Over! 💔');
            restartLevel();
        }, 500);
    }
}

function updateLives() {
    document.getElementById('livesDisplay').textContent = '❤️'.repeat(lives);
}

function checkWin() {
    const remaining = arrows.filter(a =>!a.removed).length;
    if(remaining === 0) {
        setTimeout(winLevel, 500);
    }
}

function winLevel() {
    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
    
    if(currentLevel === maxUnlocked && currentLevel < 100) {
        maxUnlocked++; saveGame();
    }

    if(currentLevel % 2 === 0 && canShowAd) {
        canShowAd = false;
        setTimeout(() => { canShowAd = true; }, 30000);
        try {
            window.TelegramAdsController.triggerInterstitialBanner().then(nextLevelLoad).catch(nextLevelLoad);
        } catch(e) { nextLevelLoad(); }
    } else {
        nextLevelLoad();
    }
}

function nextLevelLoad() {
    if(currentLevel < 100) { 
        currentLevel++; 
        startLevel(currentLevel); 
    } else { 
        tg.showAlert('🏆 All 100 Levels Complete!'); 
        showHome(); 
    }
}

function restartLevel() {
    generateLevel(currentLevel);
}

function showHint() {
    tg.showAlert('Hint: Tap karo teer pe. Jo bahar nikal sake pehle use nikalo!');
}

function showHome() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('homeScreen').classList.add('active');
}

function showLevelSelect() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('levelScreen').classList.add('active'); 
    renderLevelGrid();
}

function renderLevelGrid() {
    const grid = document.getElementById('levelGrid'); 
    grid.innerHTML = '';
    for(let i = 1; i <= 100; i++) {
        const btn = document.createElement('div'); 
        btn.className = 'level-btn'; 
        btn.textContent = i;
        if(i <= maxUnlocked) { 
            btn.className += ' unlocked'; 
            if(i === currentLevel) btn.className += ' current'; 
            btn.onclick = () => startLevel(i); 
        } else { 
            btn.className += ' locked'; 
        }
        grid.appendChild(btn);
    }
}

function startLevel(lvl) {
    currentLevel = lvl; 
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('gameScreen').classList.add('active'); 
    setTimeout(() => generateLevel(lvl), 100);
}

function saveGame() {
    try { localStorage.setItem('arrowEscape100', JSON.stringify({ maxUnlocked: maxUnlocked })); } catch(e) {}
}

function loadGame() {
    try {
        const saved = localStorage.getItem('arrowEscape100');
        if(saved) maxUnlocked = JSON.parse(saved).maxUnlocked || 1;
    } catch(e) {}
}

loadGame();
try { tg.BackButton.onClick(showLevelSelect); } catch(e) {}
</script>
</body>
</html>
