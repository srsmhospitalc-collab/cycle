<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arrow Puzzle 100</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #fff; overflow: hidden; height: 100vh;
        display: flex; align-items: center; justify-content: center;
    }
   .screen { display: none; width: 100%; max-width: 400px; padding: 20px; text-align: center; }
   .screen.active { display: block; }
   .btn {
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        border: none; padding: 18px 40px; border-radius: 15px;
        color: white; font-size: 20px; font-weight: 700;
        cursor: pointer; margin: 10px; width: 80%;
        box-shadow: 0 8px 20px rgba(139,92,246,0.4);
    }
   .btn:active { transform: scale(0.95); }
    h1 { font-size: 48px; margin-bottom: 10px; background: linear-gradient(135deg, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
   .subtitle { color: #94a3b8; margin-bottom: 40px; }
   .header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 15px; padding: 12px 16px;
        background: rgba(30,41,59,0.6); border-radius: 12px;
    }
   .game-grid {
        display: grid; gap: 4px; margin: 20px auto; padding: 10px;
        background: rgba(30,41,59,0.4); border-radius: 15px;
        max-width: 360px;
    }
   .cell {
        aspect-ratio: 1; background: #334155; border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; cursor: pointer; transition: 0.2s;
    }
   .cell:active { transform: scale(0.9); }
   .cell.block { background: #475569; cursor: not-allowed; }
   .cell.arrow { background: #8b5cf6; animation: pulse 1s infinite; }
   .cell.target { background: #10b981; box-shadow: 0 0 20px rgba(16,185,129,0.6); }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
   .level-grid {
        display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
        max-height: 60vh; overflow-y: auto; padding: 10px;
    }
   .level-btn {
        aspect-ratio: 1; background: #334155; border: 2px solid #475569;
        border-radius: 10px; color: #94a3b8; font-weight: 700;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
   .level-btn.unlocked { background: #8b5cf6; border-color: #7c3aed; color: white; }
   .level-btn.current { background: #10b981; border-color: #059669; animation: pulse 1s infinite; }
   .level-btn.locked { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
    <!-- Home Screen -->
    <div id="homeScreen" class="screen active">
        <h1>ARROW PUZZLE</h1>
        <p class="subtitle">100 Challenging Levels</p>
        <button class="btn" onclick="showLevelSelect()">▶ PLAY</button>
        <p style="margin-top:30px;color:#64748b">Highest: Level <span id="maxLevel">1</span></p>
    </div>

    <!-- Level Select -->
    <div id="levelScreen" class="screen">
        <h2 style="margin-bottom:20px">SELECT LEVEL</h2>
        <div class="level-grid" id="levelGrid"></div>
        <button class="btn" onclick="showHome()" style="margin-top:15px">⬅ BACK</button>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="header">
            <button onclick="showLevelSelect()" style="background:none;border:none;color:#94a3b8;font-size:24px">←</button>
            <div>Level <span id="levelNum">1</span>/100</div>
            <div>⭐ <span id="moves">0</span></div>
        </div>
        <div class="game-grid" id="gameGrid"></div>
        <p style="color:#94a3b8;margin-top:10px">Tap target 🎯 to win</p>
    </div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

// 1. RICHADS INIT - Zone 399185
window.TelegramAdsController = new TelegramAdsController();
window.TelegramAdsController.initialize({
    pubId: "1013423",
    appId: "7744", 
    debug: false // Live pe false rakhna
});

// 2. GAME DATA
let currentLevel = 1;
let maxUnlocked = 1;
let grid = [];
let arrowPos = {x: 0, y: 0};
let targetPos = {x: 0, y: 0};
let moves = 0;
let gridSize = 5;

// Load save
const saved = tg.CloudStorage.getItem('arrowSave');
if(saved) {
    const data = JSON.parse(saved);
    maxUnlocked = data.maxUnlocked || 1;
    document.getElementById('maxLevel').textContent = maxUnlocked;
}

// 3. LEVEL GENERATOR - Auto difficulty badhegi
function generateLevel(lvl) {
    gridSize = Math.min(5 + Math.floor(lvl / 15), 9); // Level 1=5x5, Level 100=9x9
    const blockCount = Math.min(3 + Math.floor(lvl / 5), 20); // Har 5 level pe block badhe
    
    grid = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
    
    // Random blocks
    let blocks = 0;
    while(blocks < blockCount) {
        const x = Math.floor(Math.random() * gridSize);
        const y = Math.floor(Math.random() * gridSize);
        if(grid[y][x] === 0 &&!(x === 0 && y === 0) &&!(x === gridSize-1 && y === gridSize-1)) {
            grid[y][x] = 1; // 1 = block
            blocks++;
        }
    }
    
    arrowPos = {x: 0, y: 0};
    targetPos = {x: gridSize-1, y: gridSize-1};
    grid[0][0] = 2; // 2 = arrow
    grid[gridSize-1][gridSize-1] = 3; // 3 = target
    moves = 0;
}

function renderGrid() {
    const gameGrid = document.getElementById('gameGrid');
    gameGrid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    gameGrid.innerHTML = '';
    
    for(let y = 0; y < gridSize; y++) {
        for(let x = 0; x < gridSize; x++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            if(grid[y][x] === 1) {
                cell.className += ' block';
                cell.textContent = '⬛';
            } else if(grid[y][x] === 2) {
                cell.className += ' arrow';
                cell.textContent = '➡️';
            } else if(grid[y][x] === 3) {
                cell.className += ' target';
                cell.textContent = '🎯';
            }
            
            cell.onclick = () => moveArrow(x, y);
            gameGrid.appendChild(cell);
        }
    }
    document.getElementById('moves').textContent = moves;
    document.getElementById('levelNum').textContent = currentLevel;
}

// 4. ARROW MOVEMENT - Simple logic: click karo jahan jana hai
function moveArrow(x, y) {
    if(grid[y][x] === 1) return; // Block pe nahi ja sakta
    
    // Line of sight check - beech me block to nahi
    const dx = Math.sign(x - arrowPos.x);
    const dy = Math.sign(y - arrowPos.y);
    if(dx!== 0 && dy!== 0) return; // Diagonal nahi
    
    let cx = arrowPos.x, cy = arrowPos.y;
    while(cx!== x || cy!== y) {
        cx += dx; cy += dy;
        if(grid[cy][cx] === 1) return; // Raaste me block hai
    }
    
    // Move karo
    grid[arrowPos.y][arrowPos.x] = 0;
    arrowPos = {x, y};
    moves++;
    
    if(grid[y][x] === 3) {
        winLevel(); // Target pe pahunch gaye
    } else {
        grid[y][x] = 2;
        renderGrid();
    }
}

// 5. WIN + AD LOGIC - Har 2 level pe ad
function winLevel() {
    tg.HapticFeedback.notificationOccurred('success');
    
    if(currentLevel === maxUnlocked && currentLevel < 100) {
        maxUnlocked++;
        tg.CloudStorage.setItem('arrowSave', JSON.stringify({maxUnlocked}));
        document.getElementById('maxLevel').textContent = maxUnlocked;
    }
    
    // Har 2 level ke baad ad - 2,4,6,8...
    if(currentLevel % 2 === 0) {
        tg.showPopup({
            title: 'Level Complete!',
            message: `Level ${currentLevel} clear! Ads ke baad next level.`,
            buttons: [{type: 'ok'}]
        });
        
        window.TelegramAdsController.triggerInterstitialBanner().then(() => {
            nextLevelLoad();
        }).catch(() => {
            nextLevelLoad(); // Ad na mile to bhi aage badho
        });
    } else {
        tg.showAlert(`Level ${currentLevel} Complete! 🎉`);
        nextLevelLoad();
    }
}

function nextLevelLoad() {
    if(currentLevel < 100) {
        currentLevel++;
        startLevel(currentLevel);
    } else {
        tg.showAlert('🏆 Sab 100 Level Complete! You are a Puzzle Master!');
        showHome();
    }
}

// 6. SCREEN NAVIGATION
function showHome() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('homeScreen').classList.add('active');
}

function showLevelSelect() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('levelScreen').classList.add('active');
    renderLevelGrid();
}

function renderLevelGrid() {
    const grid = document.getElementById('levelGrid');
    grid.innerHTML = '';
    for(let i = 1; i <= 100; i++) {
        const btn = document.createElement('div');
        btn.className = 'level-btn';
        btn.textContent = i;
        
        if(i <= maxUnlocked) {
            btn.className += ' unlocked';
            if(i === currentLevel) btn.className += ' current';
            btn.onclick = () => startLevel(i);
        } else {
            btn.className += ' locked';
        }
        grid.appendChild(btn);
    }
}

function startLevel(lvl) {
    currentLevel = lvl;
    generateLevel(lvl);
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('gameScreen').classList.add('active');
    renderGrid();
}

tg.BackButton.onClick(showLevelSelect);
</script>
</body>
</html>
