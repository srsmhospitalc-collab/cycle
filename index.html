<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maze Puzzle 100</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  try {
    window.TelegramAdsController = new TelegramAdsController();
    window.TelegramAdsController.initialize({
      pubId: "1013423",
      appId: "7744",
      debug: false
    });
  } catch(e) {
    console.log("Ads init failed - Web pe chal raha hai shayad");
  }
</script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        font-family: 'Segoe UI', sans-serif; 
        background: #fff; 
        color: #000; 
        min-height: 100vh; 
    }
  .container { max-width: 420px; margin: 0 auto; padding: 15px; }
  .screen { display: none; }
  .screen.active { display: block; }
    
  .game-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding: 0 5px;
    }
  .icon-btn {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: #4a90e2;
        border: none;
        color: white;
        font-size: 22px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
  .level-badge {
        background: #4a90e2;
        color: white;
        padding: 10px 30px;
        border-radius: 25px;
        font-size: 18px;
        font-weight: 700;
    }
  .lives {
        text-align: center;
        font-size: 24px;
        margin: 8px 0 15px;
        letter-spacing: 5px;
    }
    
  .maze-grid {
        display: grid;
        gap: 2px;
        margin: 15px auto;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 10px;
        max-width: 380px;
    }
  .maze-cell {
        aspect-ratio: 1;
        background: #fff;
        border: 2px solid #000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
    }
  .maze-cell.wall { background: #000; border: none; }
  .maze-cell.start { background: #10b981; color: white; font-weight: 900; }
  .maze-cell.end { background: #ef4444; color: white; }
  .maze-cell.player { background: #4a90e2; border-radius: 50%; }
  .maze-cell.path { border: 1px solid #ddd; }
    
  .bottom-bar {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        padding: 0 20px;
    }
  .circle-btn {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        background: #e0e0e0;
        border: none;
        font-size: 24px;
        cursor: pointer;
    }
  .hint-btn { background: #ffc107; }
    
  .btn { 
        background: #4a90e2; 
        border: none; 
        padding: 18px 40px; 
        border-radius: 15px; 
        color: white; 
        font-size: 20px; 
        font-weight: 700; 
        cursor: pointer; 
        margin: 10px; 
        width: 85%; 
    }
    h1 { font-size: 42px; margin: 30px 0 10px; color: #4a90e2; text-align: center; }
    
    /* FIX: Level Grid CSS */
  .level-grid { 
        display: grid; 
        grid-template-columns: repeat(5, 1fr); 
        gap: 8px; 
        max-height: 60vh; 
        overflow-y: auto; 
        padding: 10px; 
        margin: 20px 0;
    }
  .level-btn { 
        aspect-ratio: 1; 
        background: #e0e0e0; 
        border: 2px solid #ccc; 
        border-radius: 10px; 
        color: #666; 
        font-weight: 700; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-size: 14px; 
    }
  .level-btn.unlocked { background: #4a90e2; border-color: #357abd; color: white; }
  .level-btn.current { background: #10b981; border-color: #059669; }
  .level-btn.locked { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
    <div id="homeScreen" class="screen active">
        <h1>MAZE PUZZLE</h1>
        <p style="color:#666;margin-bottom:40px;text-align:center">100 Challenging Levels</p>
        <div style="text-align:center">
            <button class="btn" onclick="showLevelSelect()">▶ PLAY GAME</button>
        </div>
    </div>

    <div id="levelScreen" class="screen">
        <h2 style="margin-bottom:15px;text-align:center;color:#4a90e2">SELECT LEVEL</h2>
        <div class="level-grid" id="levelGrid"></div>
        <div style="text-align:center">
            <button class="btn" onclick="showHome()">⬅ BACK</button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button class="icon-btn" onclick="showLevelSelect()">←</button>
            <div class="level-badge">Level <span id="levelNum">1</span></div>
            <button class="icon-btn">⚙️</button>
        </div>
        <div class="lives">❤️❤️❤️</div>
        
        <div class="maze-grid" id="mazeGrid"></div>
        
        <div class="bottom-bar">
            <button class="circle-btn">#</button>
            <button class="circle-btn hint-btn" onclick="showHint()">💡</button>
        </div>
    </div>
</div>

<script>
// FIX: Telegram check with try-catch
let tg = null;
try {
    tg = window.Telegram.WebApp;
    tg.ready(); 
    tg.expand();
} catch(e) {
    console.log("Telegram me nahi hai - Web mode");
    tg = {
        HapticFeedback: { notificationOccurred: () => {} },
        showAlert: (msg) => alert(msg),
        BackButton: { onClick: () => {} }
    };
}

let currentLevel = 1, maxUnlocked = 1, maze = [], playerPos = {x: 0, y: 0};
let canShowAd = true;
let mazeSize = 7;

function generateMaze(lvl) {
    mazeSize = Math.min(7 + Math.floor(lvl / 15), 15);
    maze = Array(mazeSize).fill().map(() => Array(mazeSize).fill(1));
    
    let x = 0, y = 0;
    maze[0][0] = 0;
    playerPos = {x: 0, y: 0};
    
    while(x < mazeSize-1 || y < mazeSize-1) {
        if(x === mazeSize-1) y++;
        else if(y === mazeSize-1) x++;
        else Math.random() > 0.5? x++ : y++;
        maze[y][x] = 0;
        
        if(lvl > 10 && Math.random() > 0.7) {
            let rx = Math.floor(Math.random() * mazeSize);
            let ry = Math.floor(Math.random() * mazeSize);
            maze[ry][rx] = 0;
        }
    }
    maze[mazeSize-1][mazeSize-1] = 2;
}

function renderMaze() {
    const mazeGrid = document.getElementById('mazeGrid');
    mazeGrid.style.gridTemplateColumns = `repeat(${mazeSize}, 1fr)`;
    mazeGrid.innerHTML = '';
    
    for(let y = 0; y < mazeSize; y++) {
        for(let x = 0; x < mazeSize; x++) {
            const cell = document.createElement('div'); 
            cell.className = 'maze-cell';
            
            if(x === playerPos.x && y === playerPos.y) {
                cell.className += ' player';
            }
            else if(maze[y][x] === 1) cell.className += ' wall';
            else if(maze[y][x] === 2) { cell.className += ' end'; cell.textContent = '🏁'; }
            else if(x === 0 && y === 0) { cell.className += ' start'; cell.textContent = 'S'; }
            else cell.className += ' path';
            
            cell.onclick = () => movePlayer(x, y);
            mazeGrid.appendChild(cell);
        }
    }
    document.getElementById('levelNum').textContent = currentLevel;
}

function movePlayer(x, y) {
    if(maze[y][x] === 1) return;
    const dx = Math.abs(x - playerPos.x), dy = Math.abs(y - playerPos.y);
    if(dx + dy!== 1) return;
    
    playerPos = {x, y};
    
    if(maze[y][x] === 2) {
        winLevel();
    } else {
        renderMaze();
    }
}

function winLevel() {
    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
    
    if(currentLevel === maxUnlocked && currentLevel < 100) {
        maxUnlocked++; saveGame();
    }

    // 2 Level pe ek Ad + 30 sec lock
    if(currentLevel % 2 === 0 && canShowAd) {
        console.log('Ad dikha raha hu Level', currentLevel);
        canShowAd = false;
        setTimeout(() => { 
            canShowAd = true; 
            console.log('Ad lock khul gaya'); 
        }, 30000);

        try {
            window.TelegramAdsController.triggerInterstitialBanner().then(() => {
                nextLevelLoad();
            }).catch(() => { 
                nextLevelLoad(); 
            });
        } catch(e) {
            console.log('Ad error:', e);
            nextLevelLoad();
        }
    } else {
        nextLevelLoad();
    }
}

function nextLevelLoad() {
    if(currentLevel < 100) { 
        currentLevel++; 
        startLevel(currentLevel); 
    } else { 
        tg.showAlert('🏆 All 100 Levels Complete!'); 
        showHome(); 
    }
}

function showHint() {
    tg.showAlert('Hint: S se 🏁 tak jao. Sirf upar/neeche/daye/baye move kar sakte ho.');
}

function showHome() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('homeScreen').classList.add('active');
}

function showLevelSelect() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('levelScreen').classList.add('active'); 
    renderLevelGrid();
}

function renderLevelGrid() {
    const grid = document.getElementById('levelGrid'); 
    grid.innerHTML = '';
    for(let i = 1; i <= 100; i++) {
        const btn = document.createElement('div'); 
        btn.className = 'level-btn'; 
        btn.textContent = i;
        if(i <= maxUnlocked) { 
            btn.className += ' unlocked'; 
            if(i === currentLevel) btn.className += ' current'; 
            btn.onclick = () => startLevel(i); 
        } else { 
            btn.className += ' locked'; 
        }
        grid.appendChild(btn);
    }
}

function startLevel(lvl) {
    currentLevel = lvl; 
    generateMaze(lvl);
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('gameScreen').classList.add('active'); 
    renderMaze();
}

function saveGame() {
    try { 
        localStorage.setItem('mazePuzzle100', JSON.stringify({ maxUnlocked: maxUnlocked })); 
    } catch(e) {}
}

function loadGame() {
    try {
        const saved = localStorage.getItem('mazePuzzle100');
        if(saved) { 
            const data = JSON.parse(saved); 
            maxUnlocked = data.maxUnlocked || 1; 
        }
    } catch(e) {}
}

loadGame();
// FIX: BackButton sirf Telegram me
try { tg.BackButton.onClick(showLevelSelect); } catch(e) {}
</script>
</body>
</html>
