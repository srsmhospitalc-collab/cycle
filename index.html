<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>One Line Maze 100</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  try {
    window.TelegramAdsController = new TelegramAdsController();
    window.TelegramAdsController.initialize({
      pubId: "1013423",
      appId: "7744",
      debug: false
    });
  } catch(e) {}
</script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        font-family: 'Segoe UI', sans-serif; 
        background: #fff; 
        color: #000; 
        min-height: 100vh;
        overflow: hidden;
    }
.container { max-width: 420px; margin: 0 auto; padding: 10px; }
.screen { display: none; }
.screen.active { display: block; }
    
    /* Header */
.game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 10px 5px; }
.icon-btn { width: 45px; height: 45px; border-radius: 50%; background: #4a90e2; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
.level-badge { background: #4a90e2; color: white; padding: 12px 35px; border-radius: 25px; font-size: 18px; font-weight: 700; }
.top-right-icons { display: flex; flex-direction: column; gap: 8px; }
.color-wheel { width: 45px; height: 45px; border-radius: 50%; background: conic-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000); }
.lives { text-align: center; font-size: 22px; margin: 5px 0 15px; letter-spacing: 8px; }
    
    /* Maze Canvas */
.maze-wrapper { position: relative; width: 100%; height: 60vh; background: #fff; }
#mazeCanvas { width: 100%; height: 100%; touch-action: none; }
    
.bottom-bar { display: flex; justify-content: space-between; margin-top: 25px; padding: 0 40px; }
.circle-btn { width: 60px; height: 60px; border-radius: 50%; background: #e8e8e8; border: none; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #999; }
.hint-btn { background: #ffc107; color: #fff; position: relative; }
.hint-btn::after {
        content: '▶';
        position: absolute;
        top: -5px;
        right: -5px;
        background: #4caf50;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
.btn { background: #4a90e2; border: none; padding: 18px 40px; border-radius: 15px; color: white; font-size: 20px; font-weight: 700; cursor: pointer; margin: 10px; width: 85%; }
    h1 { font-size: 42px; margin: 30px 0 10px; color: #4a90e2; text-align: center; }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 60vh; overflow-y: auto; padding: 10px; margin: 20px 0; }
.level-btn { aspect-ratio: 1; background: #e0e0e0; border: 2px solid #ccc; border-radius: 10px; color: #666; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.level-btn.unlocked { background: #4a90e2; border-color: #357abd; color: white; }
.level-btn.current { background: #10b981; border-color: #059669; }
.level-btn.locked { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
    <div id="homeScreen" class="screen active">
        <h1>ONE LINE MAZE</h1>
        <p style="color:#666;margin-bottom:40px;text-align:center">100 Challenging Levels</p>
        <div style="text-align:center">
            <button class="btn" onclick="showLevelSelect()">▶ PLAY GAME</button>
        </div>
    </div>

    <div id="levelScreen" class="screen">
        <h2 style="margin-bottom:15px;text-align:center;color:#4a90e2">SELECT LEVEL</h2>
        <div class="level-grid" id="levelGrid"></div>
        <div style="text-align:center">
            <button class="btn" onclick="showHome()">⬅ BACK</button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button class="icon-btn" onclick="showLevelSelect()">←</button>
            <div class="level-badge">Level <span id="levelNum">1</span></div>
            <div class="top-right-icons">
                <button class="icon-btn">⚙️</button>
                <div class="color-wheel"></div>
            </div>
        </div>
        <div class="lives">❤️❤️❤️</div>
        
        <div class="maze-wrapper">
            <canvas id="mazeCanvas"></canvas>
        </div>
        
        <div class="bottom-bar">
            <button class="circle-btn" onclick="restartLevel()">🔄</button>
            <button class="circle-btn hint-btn" onclick="showHint()">💡</button>
        </div>
    </div>
</div>

<script>
let tg = null;
try {
    tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
} catch(e) {
    tg = { HapticFeedback: { notificationOccurred: () => {} }, showAlert: (msg) => alert(msg), BackButton: { onClick: () => {} } };
}

let currentLevel = 1, maxUnlocked = 1, canShowAd = true;
let canvas, ctx, isDrawing = false, drawPath = [], mazePath = [];

// Level 46 ka pattern video se
const LEVELS = {
    1: {
        size: 400,
        start: {x: 50, y: 350},
        end: {x: 350, y: 50},
        maze: [
            {x: 50, y: 350}, {x: 50, y: 300}, {x: 100, y: 300}, {x: 100, y: 250},
            {x: 150, y: 250}, {x: 150, y: 300}, {x: 200, y: 300}, {x: 200, y: 250},
            {x: 250, y: 250}, {x: 250, y: 200}, {x: 300, y: 200}, {x: 300, y: 150},
            {x: 350, y: 150}, {x: 350, y: 100}, {x: 300, y: 100}, {x: 300, y: 50},
            {x: 350, y: 50}
        ]
    },
    46: {
        size: 400,
        start: {x: 40, y: 300},
        end: {x: 360, y: 80},
        maze: [
            {x: 40, y: 300}, {x: 40, y: 250}, {x: 80, y: 250}, {x: 80, y: 200},
            {x: 120, y: 200}, {x: 120, y: 150}, {x: 160, y: 150}, {x: 160, y: 200},
            {x: 200, y: 200}, {x: 200, y: 150}, {x: 240, y: 150}, {x: 240, y: 100},
            {x: 280, y: 100}, {x: 280, y: 150}, {x: 320, y: 150}, {x: 320, y: 100},
            {x: 360, y: 100}, {x: 360, y: 80}
        ]
    }
};

function initCanvas() {
    canvas = document.getElementById('mazeCanvas');
    ctx = canvas.getContext('2d');
    
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    
    // Touch events
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', drawing);
    canvas.addEventListener('touchend', endDraw);
    
    // Mouse events
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', drawing);
    canvas.addEventListener('mouseup', endDraw);
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches? e.touches[0].clientX : e.clientX;
    const clientY = e.touches? e.touches[0].clientY : e.clientY;
    return {
        x: clientX - rect.left,
        y: clientY - rect.top
    };
}

function startDraw(e) {
    e.preventDefault();
    const pos = getPos(e);
    const start = getCurrentLevel().start;
    
    // Start point ke paas click kiya kya
    if(Math.abs(pos.x - start.x) < 20 && Math.abs(pos.y - start.y) < 20) {
        isDrawing = true;
        drawPath = [start];
    }
}

function drawing(e) {
    if(!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    drawPath.push(pos);
    render();
}

function endDraw(e) {
    if(!isDrawing) return;
    isDrawing = false;
    
    // Check if reached end
    const last = drawPath[drawPath.length - 1];
    const end = getCurrentLevel().end;
    if(Math.abs(last.x - end.x) < 30 && Math.abs(last.y - end.y) < 30) {
        winLevel();
    } else {
        // Reset if not complete
        drawPath = [];
        render();
    }
}

function getCurrentLevel() {
    return LEVELS[currentLevel] || LEVELS[46]; // Default level 46 ka pattern
}

function render() {
    const level = getCurrentLevel();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw maze path - BLACK
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    
    for(let i = 0; i < level.maze.length - 1; i++) {
        const curr = level.maze[i];
        const next = level.maze[i + 1];
        ctx.moveTo(curr.x, curr.y);
        ctx.lineTo(next.x, next.y);
    }
    ctx.stroke();
    
    // Draw user path - GRAY
    if(drawPath.length > 1) {
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(drawPath[0].x, drawPath[0].y);
        for(let i = 1; i < drawPath.length; i++) {
            ctx.lineTo(drawPath[i].x, drawPath[i].y);
        }
        ctx.stroke();
    }
    
    // Start point - Green dot
    ctx.fillStyle = '#10b981';
    ctx.beginPath();
    ctx.arc(level.start.x, level.start.y, 8, 0, Math.PI * 2);
    ctx.fill();
    
    // End point - Red dot 
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(level.end.x, level.end.y, 8, 0, Math.PI * 2);
    ctx.fill();
    
    document.getElementById('levelNum').textContent = currentLevel;
}

function winLevel() {
    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
    
    if(currentLevel === maxUnlocked && currentLevel < 100) {
        maxUnlocked++; saveGame();
    }

    if(currentLevel % 2 === 0 && canShowAd) {
        canShowAd = false;
        setTimeout(() => { canShowAd = true; }, 30000);
        try {
            window.TelegramAdsController.triggerInterstitialBanner().then(nextLevelLoad).catch(nextLevelLoad);
        } catch(e) { nextLevelLoad(); }
    } else {
        nextLevelLoad();
    }
}

function nextLevelLoad() {
    if(currentLevel < 100) { 
        currentLevel++; 
        startLevel(currentLevel); 
    } else { 
        tg.showAlert('🏆 All 100 Levels Complete!'); 
        showHome(); 
    }
}

function restartLevel() {
    drawPath = [];
    render();
}

function showHint() {
    tg.showAlert('Hint: Start se end tak line draw karo!');
}

function showHome() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('homeScreen').classList.add('active');
}

function showLevelSelect() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('levelScreen').classList.add('active'); 
    renderLevelGrid();
}

function renderLevelGrid() {
    const grid = document.getElementById('levelGrid'); 
    grid.innerHTML = '';
    for(let i = 1; i <= 100; i++) {
        const btn = document.createElement('div'); 
        btn.className = 'level-btn'; 
        btn.textContent = i;
        if(i <= maxUnlocked) { 
            btn.className += ' unlocked'; 
            if(i === currentLevel) btn.className += ' current'; 
            btn.onclick = () => startLevel(i); 
        } else { 
            btn.className += ' locked'; 
        }
        grid.appendChild(btn);
    }
}

function startLevel(lvl) {
    currentLevel = lvl; 
    drawPath = [];
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('gameScreen').classList.add('active'); 
    setTimeout(() => {
        initCanvas();
        render();
    }, 100);
}

function saveGame() {
    try { localStorage.setItem('mazePuzzle100', JSON.stringify({ maxUnlocked: maxUnlocked })); } catch(e) {}
}

function loadGame() {
    try {
        const saved = localStorage.getItem('mazePuzzle100');
        if(saved) maxUnlocked = JSON.parse(saved).maxUnlocked || 1;
    } catch(e) {}
}

loadGame();
try { tg.BackButton.onClick(showLevelSelect); } catch(e) {}
</script>
</body>
</html>
