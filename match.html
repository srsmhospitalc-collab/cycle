<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MATCH 3D - 100 LEVELS</title>
  <link rel="stylesheet" href="match.css" />
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
  <script>
    window.TelegramAdsController = new TelegramAdsController();
    window.TelegramAdsController.initialize({ pubId: "1013423", appId: "7744" });
  </script>
  <script src='//libtl.com/sdk.js' data-zone='11215599' data-sdk='show_11215599'></script>
  <script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000468"></script>
</head>
<body>
  <header class="top">
    <div class="brand">🧩 MATCH 3D</div>
    <div class="level-info"><span id="levelLabel">LEVEL 1</span><span id="tilesLeft">0 tiles</span></div>
    <button id="gridBtn">☰</button>
  </header>
  <div data-abx-banner="3c76eab41644" data-abx-w="320" data-abx-h="50" style="display:inline-block;width:320px;height:50px;line-height:0"></div>
<script async src="https://sdk.adsbitvex.com/functions/v1/banner-serve?action=sdk"></script>

  <div id="board" class="board"></div>

  <div class="tray-wrap">
    <div class="tray" id="tray"></div>
    <div class="tray-tools">
      <button id="undoBtn">↩ Undo</button>
      <button id="shuffleBtn">🔀 Shuffle 📺</button>
      <button id="hintBtn">💡 Hint 📺</button>
    </div>
  </div>

  <div id="levelModal" class="modal show">
    <div class="modal-box">
      <h2>100 LEVELS MATCH 3D</h2>
      <p>7 slots only, 3 same = clear</p>
      <div id="levelGrid" class="level-grid"></div>
      <button id="closeModal" class="main-btn">PLAY</button>
    </div>
  </div>

  <div id="adModal" class="modal">
    <div class="modal-box">
      <div class="lock">🔒</div>
      <h3 id="adTitle">Unlock Level</h3>
      <p>Ad dekho aur unlock karo</p>
      <button id="watchAdBtn" class="main-btn">📺 WATCH AD & UNLOCK</button>
      <button id="cancelAd" class="ghost">Cancel</button>
      <div id="adStatus"></div>
    </div>
  </div>

  <div id="winModal" class="modal">
    <div class="modal-box win">
      <h2>🎉 Level Clear!</h2>
      <p id="winStats"></p>
      <button id="nextBtn" class="main-btn">NEXT LEVEL →</button>
    </div>
  </div>

  <div id="loseModal" class="modal">
    <div class="modal-box lose">
      <h2>😵 Tray Full!</h2>
      <p>7 tiles se zyada nahi rakh sakte</p>
      <button id="continueBtn" class="main-btn">CONTINUE 📺</button>
      <button id="restartBtn" class="ghost">Restart Level</button>
    </div>
  </div>
  <script>
  history.pushState(null, "", location.href);
  window.onpopstate = function() {
    window.location.href = "index.html";
  };
</script>

  <script src="match.js"></script>
</body>
</html>
