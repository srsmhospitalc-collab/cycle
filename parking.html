<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PARKING JAM - 100 LEVELS</title>
  <link rel="stylesheet" href="parking.css" />
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
  <script>window.TelegramAdsController=new TelegramAdsController(); window.TelegramAdsController.initialize({pubId:"1013423",appId:"7744"});</script>
  <script src='//libtl.com/sdk.js' data-zone='11215599' data-sdk='show_11215599'></script>
  <script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000468"></script>
</head>
<body>
  <header class="top">
    <a href="index.html" class="back-btn">← BACK</a>
    <div class="brand">🚗 PARKING JAM</div>
    <div class="info"><span id="levelLabel">LEVEL 1</span> <span id="moves">0 moves</span></div>
    <button id="gridBtn">☰</button>
  </header>
  <div class="game-area">
    <div id="boardWrap" class="board-wrap">
      <div id="board" class="board"></div>
      <div class="exit"><span>EXIT →</span></div>
    </div>
  </div>
  <div class="controls">
    <button id="undoBtn">↩ Undo</button>
    <button id="hintBtn">💡 Hint 📺</button>
    <button id="restartBtn">🔄 Restart</button>
  </div>

  <div id="levelModal" class="modal show">
    <div class="modal-box">
      <h2>PARKING JAM - 100 LEVELS</h2>
      <p>Red car ko EXIT tak nikalo</p>
      <div id="levelGrid" class="level-grid"></div>
      <div style="display:flex; gap:8px">
        <a href="index.html" class="ghost-btn">← Back to Menu</a>
        <button id="closeModal" class="main-btn" style="flex:1">PLAY</button>
      </div>
    </div>
  </div>

  <div id="adModal" class="modal">
    <div class="modal-box">
      <div class="lock">🔒</div>
      <h3 id="adTitle">Level Locked</h3>
      <p>Ad dekho aur unlock karo</p>
      <button id="watchAdBtn" class="main-btn">📺 WATCH AD & UNLOCK</button>
      <button id="cancelAd" class="ghost">Cancel</button>
      <div id="adStatus"></div>
    </div>
  </div>

  <div id="winModal" class="modal">
    <div class="modal-box win">
      <h2>🎉 Parked Out!</h2>
      <p id="winStats">0 moves</p>
      <button id="nextBtn" class="main-btn">NEXT LEVEL →</button>
      <a href="index.html" class="ghost">← Menu</a>
    </div>
  </div>

  <script src="parking.js"></script>
</body>
</html>
