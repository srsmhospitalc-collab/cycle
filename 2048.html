<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="adsbitvex-verify" content="55wFuniMvmgugxDFM5cH5BAp">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 TOWER 5x5</title>
<link rel="stylesheet" href="2048.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000468"></script>
<style>
  /* MIDDLE WALA PROFESSIONAL BACK BUTTON */
  .back-wrapper-middle {
    display: flex;
    justify-content: center;
    margin: 12px 0 18px 0;
  }
  .back-btn-pro-middle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 100px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: all 0.2s;
  }
  .back-btn-pro-middle:active {
    transform: scale(0.95);
    background: rgba(255,255,255,0.2);
  }
  .back-btn-pro-middle svg {
    width: 18px;
    height: 18px;
  }
</style>
</head>
<body>
<div class="bg-blur"></div>
<div id="levelScreen" class="main">
  <h1>2048<span>TOWER 5x5</span></h1>
  <p class="subtitle">Select Level</p>
  
  <!-- YEH RAHA MIDDLE WALA PROFESSIONAL BACK BUTTON -->
  <div class="back-wrapper-middle">
    <button class="back-btn-pro-middle" onclick="if(window.Telegram && Telegram.WebApp) Telegram.WebApp.close(); else history.back();">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back
    </button>
  </div>

  <div id="levelGrid"></div>
  <button id="unlockBtn" style="display:none; margin:20px auto; width:90%; max-width:340px; padding:14px; background:#ff9800; color:#fff; border:none; border-radius:14px; font-weight:bold;">🔓 AD Dekho - Level Unlock Karo</button>
</div>
<div id="gameScreen" class="main hidden">
  <div class="top">
    <button class="back-btn" onclick="showLevelScreen()">← LEVELS</button>
    <div class="score-box"><div class="label">SCORE / TARGET</div><div><span id="score">0</span> / <span id="target">200</span></div></div>
  </div>
  <div class="level-info-bar">LEVEL <b id="level">1</b> - TARGET <b id="target2">200</b></div>
  <div class="progress-bar"><div id="progress-fill"></div></div>
  <div id="board"></div>
  <div class="next-card"><div class="next-label">NEXT</div><div id="next" class="tile c-2">2</div><button onclick="handleRestartWithAd()">RESTART LEVEL</button></div>
</div>
<script src="2048.js"></script>
<script>
// ADS LOGIC
let adCounter = 0;
document.getElementById('unlockBtn').onclick = function() {
  let btn = this; btn.innerText = "Ad Loading...";
  if (typeof window.showadsbitvex === 'function') {
    window.showadsbitvex().then(() => {
      if(typeof unlockNextLevel === 'function') unlockNextLevel();
      else { localStorage.setItem('maxUnlockedLevel', parseInt(localStorage.getItem('maxUnlockedLevel')||1)+1); location.reload(); }
    }).catch(e => { btn.innerText = "Retry Karo"; alert("Ad load nahi hua"); });
  } else { alert("SDK load nahi hua, 2 sec me try karo"); btn.innerText="🔓 AD Dekho - Level Unlock Karo"; }
};
function handleRestartWithAd(){
  adCounter++;
  if(adCounter % 2 === 0 && typeof window.showadsbitvex === 'function'){
    window.showadsbitvex().then(() => restartLevel()).catch(() => restartLevel());
  } else { restartLevel(); }
}
</script>
</body>
</html>
