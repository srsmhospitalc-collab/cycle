<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 TOWER 5x5</title>
<link rel="stylesheet" href="2048.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- RichAds SDK -->
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  try {
    if(window.parent && window.parent.TelegramAdsController && !window.TelegramAdsController){
      window.TelegramAdsController = window.parent.TelegramAdsController;
    } else if(typeof TelegramAdsController !== 'undefined' && !window.TelegramAdsController.triggerInterstitialBanner){
      window.TelegramAdsController = new TelegramAdsController();
      window.TelegramAdsController.initialize({ pubId: "1013423", appId: "7744" });
    }
  } catch(e){ console.log('RichAds init error', e); }
</script>

<!-- Monetag SDK - Parent fallback -->
<script>
  if(window.parent && window.parent.show_11215599 && !window.show_11215599){
    window.show_11215599 = window.parent.show_11215599;
  }
</script>
<script src="https://libtl.com/sdk.js" data-zone="11215599" data-sdk="show_11215599"></script>
</head>
<body>

<div id="levelScreen" class="main">
  <h1>2048<span>TOWER 5x5</span></h1>
  <p class="subtitle">Select Level</p>
  <div class="back-wrapper-middle">
    <button class="back-btn-pro-middle" onclick="if(window.parent && window.parent.closeGame) window.parent.closeGame(); else window.location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </button>
  </div>
  <div id="levelGrid"></div>
</div>

<!-- CENTER ME WATCH ADS MODAL -->
<div id="centerAdModal" class="center-modal hidden">
  <div class="center-modal-box">
    <div class="center-modal-icon">🔓</div>
    <h3 id="centerAdTitle">Level Locked</h3>
    <p id="centerAdDesc">Watch Ad to Unlock</p>
    <button id="centerWatchBtn">▶️ WATCH AD & UNLOCK</button>
    <button id="centerCancelBtn">Cancel</button>
  </div>
</div>

<div id="gameScreen" class="main hidden">
  <div class="top">
    <button class="back-btn" onclick="showLevelScreen()">← LEVELS</button>
    <div class="score-box"><div class="label">SCORE / TARGET</div><div><span id="score">0</span> / <span id="target">200</span></div></div>
  </div>
  <div class="level-info-bar">LEVEL <b id="level">1</b> - TARGET <b id="target2">200</b></div>
  <div class="progress-bar"><div id="progress-fill"></div></div>
  <div id="board"></div>
  <div class="next-card"><div class="next-label">NEXT</div><div id="next" class="tile c-2">2</div><button onclick="restartLevel()">RESTART LEVEL</button></div>
</div>

<script src="2048.js"></script>
</body>
</html>
