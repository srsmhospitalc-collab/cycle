<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FRUIT MERGE</title>
<link rel="stylesheet" href="merge.css">
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>

<!-- RICH ADS -->
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  window.TelegramAdsController = new TelegramAdsController();
  window.TelegramAdsController.initialize({ pubId: "1013423", appId: "7744" });
</script>

<!-- MONETAG -->
<script src='//libtl.com/sdk.js' data-zone='11215599' data-sdk='show_11215599'></script>

<!-- ADSBITVEX -->
<script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000468"></script>
<script async src="https://sdk.adsbitvex.com/functions/v1/banner-serve?action=sdk"></script>
</head>
<body>

<div class="top">
  <div class="left">
    <a href="index.html">←</a>
    <div class="brand">🍉 FRUIT MERGE</div>
  </div>
  <div class="score">Score: <b id="scoreTxt">0</b></div>
</div>

<div class="banner-wrap">
  <div data-abx-banner="3c76eab41644" data-abx-w="320" data-abx-h="50" style="display:inline-block;width:320px;height:50px;line-height:0"></div>
</div>

<div class="game-wrap">
  <canvas id="game" width="360" height="600"></canvas>
  <div id="nextFruit"></div>
</div>

<div class="controls">
  <button id="undoBtn">↩ Undo 📺</button>
  <button id="restartBtn">↻ Restart</button>
</div>

<div class="banner-wrap">
  <div data-abx-banner="3c76eab41644" data-abx-w="320" data-abx-h="50" style="display:inline-block;width:320px;height:50px;line-height:0"></div>
</div>

<div id="overModal" class="modal">
  <div class="box">
    <h2>Game Over 😵</h2>
    <p>Score: <b id="finalScore">0</b></p>
    <button id="continueAdBtn" class="main">Continue 📺</button>
    <button id="restartAdBtn" class="ghost">Restart</button>
  </div>
</div>

<script src="merge.js"></script>
</body>
</html>
