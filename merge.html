<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FRUIT MERGE - 50 Levels</title>
<link rel="stylesheet" href="merge.css">
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>

<!-- RICH ADS INTERSTITIAL -->
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script>
  window.TelegramAdsController = new TelegramAdsController();
  window.TelegramAdsController.initialize({ pubId: "1013423", appId: "7744" });
</script>
<!-- MONETAG REWARDED -->
<script src='//libtl.com/sdk.js' data-zone='11215599' data-sdk='show_11215599'></script>
<!-- ADSBITVEX -->
<script src="https://sdk.adsbitvex.com/functions/v1/ad-script?appid=000468"></script>
<script async src="https://sdk.adsbitvex.com/functions/v1/banner-serve?action=sdk"></script>
</head>
<body>

<header class="header">
  <a href="index.html" class="back">←</a>
  <div class="title">🍉 FRUIT MERGE</div>
  <div class="lvl-badge">LVL <span id="lvlTxt">1</span>/50</div>
</header>

<div class="banner-wrap">
  <div data-abx-banner="3c76eab41644" data-abx-w="320" data-abx-h="50" style="display:inline-block;width:320px;height:50px;line-height:0"></div>
</div>

<div class="stats">
  <div class="stat"><span>Score</span><b id="scoreTxt">0</b></div>
  <div class="stat center"><div class="progress"><div id="progBar"></div></div><small id="progTxt">0/300</small></div>
  <div class="stat"><span>Best</span><b id="bestTxt">0</b></div>
</div>

<div class="game-box">
  <canvas id="game" width="360" height="600"></canvas>
  <div class="next-card"><span>NEXT</span><div id="nextFruit">🍒</div></div>
  <div class="danger-line">- - - GLASS FULL - - -</div>
</div>

<div class="controls">
  <button id="undoBtn" class="btn dark">↩ Undo <small>📺</small></button>
  <button id="restartBtn" class="btn light">↻ Restart</button>
</div>

<div class="banner-wrap">
  <div data-abx-banner="3c76eab41644" data-abx-w="320" data-abx-h="50" style="display:inline-block;width:320px;height:50px;line-height:0"></div>
</div>

<!-- LEVEL COMPLETE -->
<div id="levelModal" class="modal">
  <div class="modal-card success">
    <div class="emoji-big">🎉</div>
    <h2>LEVEL <span id="lcLvl">1</span> COMPLETE</h2>
    <p>Score <b id="lcScore">0</b> / 50 Levels</p>
    <div class="stars">⭐⭐⭐</div>
    <button id="nextLvlBtn" class="btn-main">NEXT LEVEL ▶</button>
    <small>Ad will show</small>
  </div>
</div>

<!-- LOCK 5 LEVEL -->
<div id="lockModal" class="modal">
  <div class="modal-card lock">
    <div class="emoji-big">🔒</div>
    <h2>LEVEL <span id="lockLvl">6</span> LOCKED</h2>
    <p>Watch ad to unlock next 5 levels</p>
    <button id="unlockBtn" class="btn-main">WATCH AD & UNLOCK 📺</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="overModal" class="modal">
  <div class="modal-card over">
    <div class="emoji-big">💥</div>
    <h2>GLASS FULL!</h2>
    <p>Level <b id="overLvl">1</b> • Score <b id="finalScore">0</b></p>
    <button id="halfBtn" class="btn-main green">CLEAR HALF GLASS 📺</button>
    <button id="restartAdBtn" class="btn-ghost">RESTART LEVEL</button>
  </div>
</div>

<script src="merge.js"></script>
</body>
</html>
