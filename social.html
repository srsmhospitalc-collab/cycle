<script type="module">

  const snap = await get(ref(db,'users/'+uid));

window.handleClaim8500 = async () => {

  try{
    const userRef = ref(db,'users/'+uid);
    const snap = await get(userRef);
    let bal = snap.exists() ? (snap.val().balance||0) : 0;
    bal += 8500;
    await set(userRef, { balance: bal });
    document.getElementById('coinBal').innerText = bal;
    alert("8500 Coins Added! UID: "+uid);
