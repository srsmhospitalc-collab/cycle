<script>
// ==== TERI FIREBASE CONFIG YAHAN DAAL ====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

auth.signInAnonymously();
let currentUid = null;
auth.onAuthStateChanged(user=>{
  if(user){
    currentUid=user.uid;
    db.ref('users/'+currentUid+'/coins').once('value',snap=>{
      document.getElementById('coins').innerText = snap.val() || 0;
    });
    checkLock();
  }
});

function checkLock(){
  let last = localStorage.getItem('last_claim_'+currentUid);
  if(!last) return;
  let diff = Date.now() - parseInt(last);
  let day = 86400000;
  if(diff < day) lock(day-diff);
}

function lock(rem){
  let btn=document.getElementById('claimBtn');
  btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-lock"></i> ALREADY CLAIMED';
  document.getElementById('timerBox').style.display='block';
  let iv=setInterval(()=>{
    rem-=1000;
    if(rem<=0){clearInterval(iv);btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-gift"></i> CLAIM COIN 8500';document.getElementById('timerBox').style.display='none';return;}
    let h=Math.floor(rem/3600000),m=Math.floor(rem%3600000/60000),s=Math.floor(rem%60000/1000);
    document.getElementById('tLeft').innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
}

function claimNow(){
  let last=localStorage.getItem('last_claim_'+currentUid);
  if(last && Date.now()-parseInt(last) < 86400000) return;
  
  db.ref('users/'+currentUid+'/coins').once('value').then(snap=>{
    let cur=snap.val()||0;
    let newCoins=cur+8500;
    db.ref('users/'+currentUid).update({coins:newCoins,lastClaim:Date.now()}).then(()=>{
      localStorage.setItem('last_claim_'+currentUid,Date.now().toString());
      document.getElementById('coins').innerText=newCoins;
      document.getElementById('msg').style.display='block';
      document.getElementById('claimBtn').innerHTML='<i class="fa-solid fa-check"></i> 8500 ADDED!';
      setTimeout(()=>checkLock(),1500);
    });
  });
}
</script>
