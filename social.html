<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBaxVAyNYG6v2Xs6_yF-Z_f1Tm3oftpQk",
  authDomain: "sfaearn.firebaseapp.com",
  databaseURL: "https://sfaearn-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sfaearn",
  appId: "1:451152021964:web:cf11961c89b9b7ec0f569"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const uid = tg.initDataUnsafe?.user?.id?.toString();

function bState(){
  const lock = parseInt(localStorage.getItem('claim8500_lock_'+uid)||'0');
  const btn = document.getElementById('claimBtn');
  const box = document.getElementById('timerBox');
  if(lock > Date.now()){
    btn.disabled = true;
    box.style.display = 'block';
    let iv = setInterval(()=>{
      let rem = lock - Date.now();
      if(rem <= 0){ clearInterval(iv); btn.disabled=false; btn.innerText='CLAIM COIN 8500'; box.style.display='none'; return; }
      let h=Math.floor(rem/3600000), m=Math.floor(rem%3600000/60000), s=Math.floor(rem%60000/1000);
      document.getElementById('tLeft').innerText = `${h}h ${m}m ${s}s`;
      btn.innerHTML = `LOCKED ${h}h LEFT`;
    },1000);
    return true;
  }
  btn.disabled=false;
  btn.innerHTML='CLAIM COIN 8500';
  box.style.display='none';
  return false;
}

window.handleClaim8500 = async () => {
  if(bState()) return;
  try{
    const userRef = ref(db,'users/'+uid);
    const snap = await get(userRef);
    let bal = 0;
    let lastClaim = 0;
    if(snap.exists()){
      bal = snap.val().balance||0;
      lastClaim = snap.val().lastClaim||0;
    }
    // 24h check from Firebase
    if(Date.now() - lastClaim < 86400000){
      alert("24 ghante baad hi claim hoga!");
      localStorage.setItem('claim8500_lock_'+uid, (lastClaim+86400000).toString());
      bState();
      return;
    }
    bal += 8500;
    await set(userRef, { balance: bal, lastClaim: Date.now(), id: uid });
    document.getElementById('coinBal').innerText = bal;
    localStorage.setItem('claim8500_lock_'+uid, (Date.now()+86400000).toString());
    bState();
    tg.showPopup({message:'8500 Coins Added!'});
  }catch(e){ alert(e.message); }
}
bState();
</script>
